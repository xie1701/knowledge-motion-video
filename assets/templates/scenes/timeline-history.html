<!--
  Route: timeline-history (时间轴/大事记)
  Paste the <div> below into one clip inside your composition root.
  Replaceable slots: {{TITLE}} 标题 | {{YEAR_1}}/{{EVENT_1}} … 三组节点 | {{ACCENT}} 强调色
  Axis draws first, nodes pop in chronological order, the key node (2nd here) gets
  accent + longer hold. More than 5 nodes per screen -> split the scene.
-->
<div class="km-tl" style="position:relative;width:100%;height:100%;overflow:hidden;background:var(--km-bg,#F2EDE2);">
  <div class="km-tl__title" style="position:absolute;left:8%;top:8%;font:800 42px system-ui;color:#11110F;">{{TITLE}}</div>
  <!-- 主轴（水平，画面中部） -->
  <svg class="km-tl__axis" style="position:absolute;left:6%;top:47%;width:88%;height:2px;" width="100%" height="4" preserveAspectRatio="none">
    <line class="km-tl__axisline" x1="0" y1="2" x2="100%" y2="2" stroke="#11110F" stroke-width="4"/>
  </svg>
  <!-- 节点 1（普通） -->
  <div class="km-tl__node km-tl__node--1" style="position:absolute;left:14%;top:calc(47% - 14px);width:28px;height:28px;border-radius:50%;background:#F2EDE2;border:5px solid #11110F;"></div>
  <div class="km-tl__card km-tl__card--1" style="position:absolute;left:6%;top:26%;width:36%;background:#FFFFFF;border:3px solid #11110F;padding:16px 20px;box-shadow:8px 8px 0 rgba(0,0,0,.12);">
    <div style="font:800 30px system-ui;color:#11110F;">{{YEAR_1}}</div>
    <div style="font:600 26px system-ui;color:#26241F;margin-top:6px;">{{EVENT_1}}</div>
  </div>
  <!-- 节点 2（关键，accent） -->
  <div class="km-tl__node km-tl__node--2 km-tl__node--key" style="position:absolute;left:46%;top:calc(47% - 18px);width:36px;height:36px;border-radius:50%;background:var(--km-accent,#D8341F);border:5px solid #11110F;"></div>
  <div class="km-tl__card km-tl__card--2" style="position:absolute;left:36%;top:58%;width:40%;background:var(--km-accent,#D8341F);border:3px solid #11110F;padding:16px 20px;box-shadow:8px 8px 0 rgba(0,0,0,.12);">
    <div style="font:800 32px system-ui;color:#11110F;">{{YEAR_2}}</div>
    <div style="font:600 26px system-ui;color:#11110F;margin-top:6px;">{{EVENT_2}}</div>
  </div>
  <!-- 节点 3（普通） -->
  <div class="km-tl__node km-tl__node--3" style="position:absolute;left:78%;top:calc(47% - 14px);width:28px;height:28px;border-radius:50%;background:#F2EDE2;border:5px solid #11110F;"></div>
  <div class="km-tl__card km-tl__card--3" style="position:absolute;left:60%;top:26%;width:34%;background:#FFFFFF;border:3px solid #11110F;padding:16px 20px;box-shadow:8px 8px 0 rgba(0,0,0,.12);">
    <div style="font:800 30px system-ui;color:#11110F;">{{YEAR_3}}</div>
    <div style="font:600 26px system-ui;color:#26241F;margin-top:6px;">{{EVENT_3}}</div>
  </div>
</div>
<!--
  GSAP timeline fragment (deterministic; axis draw -> nodes in chronological order
  -> key node emphasized with a longer dwell):
  tl.fromTo(".km-tl__title", { autoAlpha: 0, y: 20 }, { autoAlpha: 1, y: 0, duration: 0.3 }, 0.1)
    .fromTo(".km-tl__axisline", { strokeDasharray: 1000, strokeDashoffset: 1000 }, { strokeDashoffset: 0, duration: 0.6, ease: "power1.inOut" }, 0.3)
    .fromTo(".km-tl__node--1", { scale: 0, autoAlpha: 0 }, { scale: 1, autoAlpha: 1, duration: 0.25, ease: "back.out(2)", transformOrigin: "50% 50%" }, 0.8)
    .fromTo(".km-tl__card--1", { autoAlpha: 0, y: 24 }, { autoAlpha: 1, y: 0, duration: 0.3 }, 0.95)
    .fromTo(".km-tl__node--2", { scale: 0, autoAlpha: 0 }, { scale: 1, autoAlpha: 1, duration: 0.3, ease: "back.out(2.5)", transformOrigin: "50% 50%" }, 1.8)
    .fromTo(".km-tl__card--2", { autoAlpha: 0, y: 24 }, { autoAlpha: 1, y: 0, duration: 0.35 }, 2.0)
    .fromTo(".km-tl__node--3", { scale: 0, autoAlpha: 0 }, { scale: 1, autoAlpha: 1, duration: 0.25, ease: "back.out(2)", transformOrigin: "50% 50%" }, 3.4)
    .fromTo(".km-tl__card--3", { autoAlpha: 0, y: 24 }, { autoAlpha: 1, y: 0, duration: 0.3 }, 3.55);
  // Key node dwell (1.8 -> 3.4) is intentionally longer than normal nodes.
  // For >3 nodes on one axis: keep nodes fixed to the container and pan the
  // container x instead (camera), or split into two scenes.
// @beats enter=0.10 build=0.30 reveal=0.95 peak=2.00 settle=3.55
// 锚点语义：enter 标题 / build 时间轴 / reveal 第一张卡片 / peak 第二张卡片 / settle 第三张卡片

-->
