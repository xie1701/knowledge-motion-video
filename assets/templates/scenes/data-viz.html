<!--
  Route: data-viz (数据图表)
  Paste the <div> below into one clip inside your composition root.
  Replaceable slots: {{TITLE}} 图表标题 | {{UNIT}} 单位 | {{BARS}} 柱体/数值/类目标堆（生成）
  {{BARS}} contract: make_video.py fills this with one of two honest layouts —
  (a) bars: for each bar j of n —
    group div .km-viz__group (left = 4 + j*84/n %, width = 84/n %)
      bar div .km-viz__bar (+ .km-viz__bar--key on the key item),
        height = 18 + 70*value/vmax % (real values, never fake identical bars)
    value div .km-viz__value pinned bottom = height+4 % above its bar
    label div .km-viz__label in the same slot at bottom 16%
  (b) cards: .km-viz__cards row of .km-viz__card, each holding .km-viz__bar (accent rule),
    .km-viz__value (big number) and .km-viz__label — used when values carry different units
    (multipliers vs shares vs magnitudes), because such numbers cannot share one axis.
  Bars grow with scaleY from the axis baseline — never tween height/width
  (layout thrash breaks determinism). Colors always come from --bg/--fg/--accent
  so the wrapper palette decides light/dark — no hard-coded inks.
-->
<div class="km-viz" style="position:relative;width:100%;height:100%;overflow:hidden;background:var(--bg,#FFFFFF);">
  <div class="km-viz__title" style="position:absolute;left:8%;top:8%;font:800 42px system-ui;color:var(--fg,#11110F);">{{TITLE}}</div>
  <div class="km-viz__unit" style="position:absolute;right:8%;top:9%;font:600 26px system-ui;color:var(--muted,#8C887F);">{{UNIT}}</div>
  <!-- 图表区：底部为基线 -->
  <div class="km-viz__plot" style="position:absolute;left:8%;top:20%;width:84%;height:56%;">
    <!-- 极淡网格线 -->
    <svg style="position:absolute;inset:0;opacity:.15;" width="100%" height="100%" preserveAspectRatio="none" stroke="#11110F" stroke-width="1">
      <line x1="0" y1="25%" x2="100%" y2="25%"/><line x1="0" y1="50%" x2="100%" y2="50%"/><line x1="0" y1="75%" x2="100%" y2="75%"/>
    </svg>
    <!-- 基线 -->
    <div style="position:absolute;left:0;bottom:0;width:100%;height:3px;background:var(--fg,#11110F);"></div>
{{BARS}}
  </div>
</div>
<!--
  GSAP timeline fragment (deterministic; axis first, then data; accent key bar):
  tl.fromTo(".km-viz__title", { autoAlpha: 0, y: 20 }, { autoAlpha: 1, y: 0, duration: 0.3 }, 0.1)
    .fromTo(".km-viz__unit", { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.3 }, 0.2)
    .fromTo(".km-viz__plot svg", { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.3 }, 0.3)
    .fromTo(".km-viz__bar", { scaleY: 0 }, { scaleY: 1, duration: 0.6, stagger: 0.18, ease: "power3.out" }, 0.6)
    .fromTo(".km-viz__value", { autoAlpha: 0, y: 12 }, { autoAlpha: 1, y: 0, duration: 0.25, stagger: 0.18 }, 1.0)
    .fromTo(".km-viz__label", { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.25, stagger: 0.1 }, 1.2)
    // 压灰次要项、突出关键项（两态显式）：
    .fromTo(".km-viz__bar:not(.km-viz__bar--key)", { opacity: 1 }, { opacity: 0.35, duration: 0.4 }, 2.4)
    .fromTo(".km-viz__bar--key", { scale: 1 }, { scale: 1.04, duration: 0.3, yoyo: true, repeat: 1, transformOrigin: "bottom" }, 2.5);
  // For a line chart: stroke-dasharray = path length, fromTo(strokeDashoffset: L -> 0).
  // For ranking swaps: tween each row's y to the other row's slot (transform only).
  // Bar heights/labels are generated by make_video.py from real values via {{BARS}}.
-->
