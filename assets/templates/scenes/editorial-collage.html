<!--
  Route: editorial-collage (编辑拼贴)
  Paste the <div> below into one clip inside your composition root.
  Replaceable slots: {{TITLE}} 标题 | {{CAPTION}} 图注 | {{ACCENT}} 强调色 | {{IMG_LABEL}} 素材占位说明
  素材槽位 (scenes.json scene.assets, 设计文档 §2.1 约定):
    photo-1 → assets/media/photo-1.jpg，贴入 .km-collage__window（<img onerror 自动退回
    CSS 占位色块，向后兼容——无素材时保持原纯动效行为）
  v2.2 素材化升级（设计 §1.1）: 撕纸边缘变体 ×4（.km-collage__tear--a..d，SVG 感 polygon 毛边）、
  drop-shadow 对齐规范（≈16px 位移 / 20px 模糊 / 30% 透明度）、纸纹 overlay（feTurbulence data-uri
  正片叠底）、assets 占位支持。撕边默认关闭（加 km-collage__sheet--torn + tear class 启用）。
  音效挂点 (fetch_assets.py --sfx): 快门/翻纸声 → sheet 切入起点；纸摩擦声 → caption 落位。
  Assets: replace each .km-collage__window content with a local <img> or keep the
  code-drawn placeholder. No network assets.
  Merge the GSAP calls into your single paused timeline (times are relative to clip start).
-->
<div class="km-collage" style="position:relative;width:100%;height:100%;overflow:hidden;background:var(--km-bg,#11110F);">
  <style>
    /* v2.2 撕纸毛边变体 ×4（可选启用；clip-path 会裁掉 box-shadow，
       撕边模式下阴影交给外层 filter:drop-shadow，见 .km-collage__sheet--torn） */
    .km-collage__sheet--torn { box-shadow:none !important; filter:drop-shadow(16px 18px 20px rgba(38,36,31,.3)); }
    .km-collage__tear--a { clip-path:polygon(0% 3%,4% 1%,9% 4%,15% 2%,22% 5%,30% 1%,38% 4%,47% 2%,55% 5%,63% 2%,72% 4%,80% 1%,88% 4%,95% 2%,100% 5%,99% 14%,100% 24%,98% 34%,100% 44%,99% 55%,100% 66%,98% 77%,100% 88%,99% 96%,94% 99%,86% 97%,77% 100%,68% 97%,58% 100%,48% 98%,38% 100%,28% 97%,18% 100%,10% 98%,4% 100%,1% 92%,2% 81%,0% 70%,2% 59%,0% 48%,2% 37%,0% 26%,1% 14%); }
    .km-collage__tear--b { clip-path:polygon(2% 0%,10% 3%,19% 1%,28% 4%,37% 0%,46% 3%,56% 1%,65% 4%,74% 0%,83% 3%,92% 1%,100% 4%,98% 13%,100% 23%,97% 33%,99% 43%,98% 54%,100% 64%,97% 75%,99% 86%,98% 95%,92% 98%,83% 100%,73% 98%,63% 100%,53% 97%,43% 100%,33% 98%,23% 100%,14% 98%,6% 100%,0% 94%,2% 83%,0% 72%,2% 61%,0% 50%,2% 39%,0% 28%,1% 17%,0% 8%); }
    .km-collage__tear--c { clip-path:polygon(1% 4%,7% 0%,14% 5%,23% 2%,31% 6%,40% 2%,49% 5%,58% 1%,67% 5%,76% 2%,85% 5%,93% 1%,100% 3%,99% 12%,97% 22%,100% 32%,98% 43%,100% 53%,97% 64%,99% 74%,98% 85%,100% 94%,93% 98%,84% 100%,74% 97%,64% 100%,54% 98%,44% 100%,34% 97%,24% 100%,15% 98%,7% 100%,0% 95%,2% 85%,0% 74%,2% 63%,0% 52%,2% 41%,0% 30%,1% 19%,0% 10%); }
    .km-collage__tear--d { clip-path:polygon(0% 2%,8% 5%,17% 2%,26% 5%,35% 1%,45% 4%,54% 2%,64% 5%,73% 1%,82% 4%,91% 2%,100% 5%,98% 15%,100% 25%,97% 35%,99% 45%,97% 56%,100% 66%,98% 76%,99% 87%,97% 96%,89% 99%,79% 97%,69% 100%,59% 98%,49% 100%,39% 97%,29% 100%,19% 98%,9% 100%,2% 97%,0% 88%,2% 78%,0% 67%,2% 56%,0% 45%,2% 34%,0% 23%,1% 12%); }
    /* 纸纹 overlay：feTurbulence data-uri，正片叠底 12%，固定 seed（确定性） */
    .km-collage__texture { position:absolute; inset:0; mix-blend-mode:multiply; opacity:.12;
      pointer-events:none;
      background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='colln'><feTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='3' seed='13' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='300' height='300' filter='url(%23colln)' opacity='0.6'/></svg>");
      background-size:300px 300px; }
    /* 素材层：铺满窗口；素材缺失时 onerror 移除 <img>，露出下方占位色块 */
    .km-collage__img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  </style>
  <div class="km-collage__texture" data-layout-ignore></div>
  <div class="km-collage__sheet" style="position:absolute;left:6%;top:8%;width:88%;height:56%;background:var(--km-fg,#F5F1E8);transform:rotate(-2deg);box-shadow:16px 18px 20px rgba(38,36,31,.3);">
    <!-- 撕边启用示例（默认关闭，保持旧行为）：
    <div class="km-collage__sheet km-collage__sheet--torn" style="position:absolute;left:6%;top:8%;width:88%;height:56%;background:var(--km-fg,#F5F1E8);transform:rotate(-2deg);">
      <div class="km-collage__tear--a" style="position:absolute;inset:0;background:var(--km-fg,#F5F1E8);">
        …window 与 caption 移入这层…
      </div>
    </div>
    -->
    <!-- 主素材窗口：贴入本地 <img>（素材缺失时 onerror 移除，保留占位色块）或保留占位 -->
    <div class="km-collage__window" style="position:absolute;inset:6% 6% 18% 6%;background:#26241F;display:flex;align-items:center;justify-content:center;color:#8C887F;font:600 28px system-ui;overflow:hidden;">
      {{IMG_LABEL}}
      <img class="km-collage__img" src="assets/media/photo-1.jpg" alt="" onerror="this.remove()">
    </div>
    <div class="km-collage__caption" style="position:absolute;left:6%;bottom:4%;color:#26241F;font:700 30px system-ui;">{{CAPTION}}</div>
  </div>
  <div class="km-collage__label" style="position:absolute;right:8%;top:12%;background:var(--km-accent,#F36B3D);color:#11110F;padding:10px 22px;font:800 30px system-ui;transform:rotate(3deg);">
    {{TITLE}}
  </div>
  <div class="km-collage__underline" style="position:absolute;left:10%;bottom:16%;width:60%;height:6px;background:var(--km-accent,#F36B3D);transform-origin:left;"></div>
</div>
<!--
  GSAP timeline fragment (deterministic: explicit fromTo, transform-only, finite).
  v2.2 运动规范（设计 §1.1）: 边缘平移切入 + 0.3s 快速缩放，全 ease-in-out 家族
  （power2.inOut / power3.out）；同一元件二次 fromTo 必须带 immediateRender:false。
  SFX 挂点: 快门/翻纸声 → sheet 切入起点（0.1s）; 纸摩擦声 → caption 落位（1.1s）。
  tl.fromTo(".km-collage__sheet", { autoAlpha: 0, x: -70 }, { autoAlpha: 1, x: 0, duration: 0.5, ease: "power2.inOut" }, 0.1)   // SFX shutter
    .fromTo(".km-collage__sheet", { scale: 1.05 }, { scale: 1, duration: 0.3, ease: "power3.out",
      immediateRender: false, transformOrigin: "50% 50%" }, 0.55)
    .fromTo(".km-collage__label", { autoAlpha: 0, scale: 1.5, rotation: 8 }, { autoAlpha: 1, scale: 1, rotation: 3, duration: 0.3, ease: "power3.out" }, 0.5)
    .fromTo(".km-collage__underline", { scaleX: 0 }, { scaleX: 1, duration: 0.4, ease: "power2.inOut" }, 0.9)
    .fromTo(".km-collage__caption", { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.3 }, 1.1);      // SFX paper-rub
  // Optional evidence push-in (hold final state >= 0.8s):
  // tl.fromTo(".km-collage__window", { scale: 1 }, { scale: 1.12, duration: 1.2, ease: "power1.inOut", immediateRender: false, transformOrigin: "50% 50%" }, 1.4);
