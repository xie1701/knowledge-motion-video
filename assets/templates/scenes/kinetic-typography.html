<!--
  Route: kinetic-typography (纯文字冲击)
  Paste the <div> below into one clip inside your composition root.
  Replaceable slots: {{LINE_1}} 第一行 | {{KEY_WORD}} 被强调的词（替代行内某词单独成层） | {{LINE_2}} 结论行 | {{ACCENT}} 强调色
  Rules: one emphasized word per scene; manual line breaks only; keep text out of
  the subtitle safe area; background slab / underline are the only decoratives.
-->
<div class="km-kine" style="position:relative;width:100%;height:100%;overflow:hidden;background:var(--km-bg,#11110F);">
  <!-- 第一行（关键词拆出，占位同行用透明占位对齐） -->
  <div class="km-kine__row km-kine__row--1" style="position:absolute;left:8%;top:30%;width:84%;font:900 76px system-ui;color:#F5F1E8;line-height:1.25;">
    {{LINE_1}}<span style="opacity:0;">_</span><span class="km-kine__key" style="position:absolute;left:0;top:0;color:var(--km-accent,#F36B3D);">{{KEY_WORD}}</span>
  </div>
  <!-- 下划线扫入 -->
  <div class="km-kine__underline" style="position:absolute;left:8%;top:46%;width:56%;height:10px;background:var(--km-accent,#F36B3D);transform-origin:left;"></div>
  <!-- 结论行：同槽位替换 -->
  <div class="km-kine__row km-kine__row--2" style="position:absolute;left:8%;top:30%;width:84%;font:900 76px system-ui;color:#F5F1E8;line-height:1.25;opacity:0;">
    {{LINE_2}}
  </div>
  <!-- 几何衬底色块（装饰，退到文字后） -->
  <div class="km-kine__slab" style="position:absolute;right:-6%;top:12%;width:34%;height:20%;background:var(--km-accent,#F36B3D);transform:rotate(6deg);opacity:.9;"></div>
</div>
<!--
  GSAP timeline fragment (deterministic; word slam + one key-word pulse + line swap):
  tl.fromTo(".km-kine__slab", { x: 300, autoAlpha: 0 }, { x: 0, autoAlpha: 0.9, duration: 0.4, ease: "power3.out" }, 0.05)
    .fromTo(".km-kine__row--1", { autoAlpha: 0, scale: 1.35 }, { autoAlpha: 1, scale: 1, duration: 0.35, ease: "power3.out", transformOrigin: "50% 50%" }, 0.2)
    .fromTo(".km-kine__key", { autoAlpha: 0, scale: 1.5 }, { autoAlpha: 1, scale: 1, duration: 0.3, ease: "power4.in", transformOrigin: "50% 50%" }, 0.9)
    .fromTo(".km-kine__underline", { scaleX: 0 }, { scaleX: 1, duration: 0.35, ease: "power2.out" }, 1.2)
    // 单次强调脉冲（有限 yoyo，不是循环装饰）：
    .fromTo(".km-kine__key", { scale: 1 }, { scale: 1.12, duration: 0.18, yoyo: true, repeat: 1, ease: "power2.inOut" }, 1.7)
    // 行替换：旧行上移出、新行上移入（同槽位，显式两态）
    .to(".km-kine__row--1", { y: -40, autoAlpha: 0, duration: 0.3, ease: "power2.in" }, 3.2)
    .to(".km-kine__underline", { scaleX: 0, duration: 0.25, ease: "power2.in", transformOrigin: "right" }, 3.2)
    .fromTo(".km-kine__row--2", { autoAlpha: 0, y: 40 }, { autoAlpha: 1, y: 0, duration: 0.35, ease: "power3.out" }, 3.5);
  // Hold the conclusion line >= 1s. For multi-line rhythm, reuse the row-swap pattern
  // instead of adding more decoratives. Never tween font-size — scale the wrapper.
-->
