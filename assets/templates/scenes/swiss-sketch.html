<!--
  Route: swiss-sketch (瑞士平面手绘)
  Paste the <div> below into one clip inside your composition root.
  Replaceable slots: {{HEADLINE}} 大标题 | {{POINT_1}}/{{POINT_2}} 两条论点 | {{ACCENT}} 强调色（建议红）
  Palette discipline: near-black text on cream, one red accent, generous whitespace.
  Swap the line drawing for your own SVG line art; keep stroke-draw motion.
-->
<div class="km-swiss" style="position:relative;width:100%;height:100%;overflow:hidden;background:var(--km-bg,#F2EDE2);">
  <!-- 网格参考（极淡，装饰性定位） -->
  <svg class="km-swiss__grid" style="position:absolute;inset:0;opacity:.12;" width="100%" height="100%" preserveAspectRatio="none" stroke="#11110F" stroke-width="1">
    <line x1="10%" y1="0" x2="10%" y2="100%"/><line x1="90%" y1="0" x2="90%" y2="100%"/>
    <line x1="0" y1="30%" x2="100%" y2="30%"/><line x1="0" y1="70%" x2="100%" y2="70%"/>
  </svg>
  <!-- 红色对位标记 -->
  <svg class="km-swiss__mark" style="position:absolute;left:7%;top:7%;" width="40" height="40" viewBox="0 0 40 40" stroke="#D8341F" fill="none" stroke-width="2">
    <circle cx="20" cy="20" r="12"/><line x1="20" y1="0" x2="20" y2="40"/><line x1="0" y1="20" x2="40" y2="20"/>
  </svg>
  <div class="km-swiss__headline" style="position:absolute;left:10%;top:16%;width:80%;font:800 64px system-ui;color:#11110F;line-height:1.2;">{{HEADLINE}}</div>
  <svg class="km-swiss__drawing" style="position:absolute;left:10%;top:40%;" width="200" height="140" viewBox="0 0 200 140" stroke="#11110F" stroke-width="5" fill="none">
    <rect class="km-swiss__stroke" x="10" y="20" width="120" height="100"/>
    <line class="km-swiss__stroke" x1="130" y1="70" x2="185" y2="70"/>
    <path class="km-swiss__stroke" d="M165 50 L185 70 L165 90"/>
  </svg>
  <div class="km-swiss__point km-swiss__point--1" style="position:absolute;left:10%;top:68%;font:700 36px system-ui;color:#11110F;">{{POINT_1}}</div>
  <div class="km-swiss__point km-swiss__point--2" style="position:absolute;left:10%;top:78%;font:700 36px system-ui;color:#11110F;">{{POINT_2}}</div>
  <div class="km-swiss__accentbar" style="position:absolute;left:10%;top:66.5%;width:34%;height:5px;background:var(--km-accent,#D8341F);transform-origin:left;"></div>
</div>
<!--
  GSAP timeline fragment (deterministic: stroke-draw via dashoffset, type lockup via fromTo):
  tl.fromTo(".km-swiss__mark", { scale: 0, autoAlpha: 0 }, { scale: 1, autoAlpha: 1, duration: 0.3, ease: "back.out(2)", transformOrigin: "50% 50%" }, 0.1)
    .fromTo(".km-swiss__headline", { autoAlpha: 0, y: 24 }, { autoAlpha: 1, y: 0, duration: 0.4, ease: "power2.out" }, 0.3)
    .fromTo(".km-swiss__stroke", { strokeDasharray: 400, strokeDashoffset: 400 }, { strokeDashoffset: 0, duration: 0.8, stagger: 0.2, ease: "power1.inOut" }, 0.8)
    .fromTo(".km-swiss__point--1", { autoAlpha: 0, x: -20 }, { autoAlpha: 1, x: 0, duration: 0.3 }, 1.6)
    .fromTo(".km-swiss__point--2", { autoAlpha: 0, x: -20 }, { autoAlpha: 1, x: 0, duration: 0.3 }, 2.0)
    .fromTo(".km-swiss__accentbar", { scaleX: 0 }, { scaleX: 1, duration: 0.35, ease: "power2.out" }, 2.2);
  // Tune strokeDasharray to each path's real length for a clean single-pass draw.
-->
