<!--
  Route: paper-fold (折纸特效, 1080×1920 竖屏)
  Paste the <div> below into one clip inside your composition root.
  适用题材: 机制/工程/生态/物理系统/时间线——需要"立体书弹出"式结构演示的 beat。
  素材槽位 (scenes.json scene.assets, 设计文档 §2.1 约定):
    photo-1 → {{assets.photo-1}} 可选照片（贴在顶层面板上；缺失时保留纯 CSS 折纸，行为向后兼容）
  Replaceable slots: {{TITLE}} 标题 | {{LAYER_1_LABEL}}/{{LAYER_2_LABEL}}/{{LAYER_3_LABEL}} 各层内容 | {{ACCENT}} 强调色
  核心实现（设计 §1.2）:
    - 父容器 perspective: 1000px；折纸元件 transform-origin 固定在折点（hinge），rotateX 平铺→立起
    - 折痕 = 深色阴影线 + 高光线（渐变细线）；纸边厚度 = 同色系稍暗侧面（伪元素）
    - 全局纸纹 overlay = SVG feTurbulence data-uri，正片叠底 12% 不透明度，固定 seed（确定性）
    - 装配顺序: 由后到前、由大到小，组件逐个立起
  音效挂点 (fetch_assets.py --sfx): 翻纸/纸张摩擦声 → 每个元件立起动画的起点（见 GSAP 注释 SFX 标记）。
  Assemble inside a 1080×1920 composition: local @font-face (PingFang SC/Noto Sans SC),
  a full-duration #furniture-base clip, vendor/gsap.min.js relative script, and keep all
  text above y=1690 (bottom 230px caption safe area). See examples/style-samples/.
-->
<div class="km-pf" style="position:relative;width:100%;height:100%;overflow:hidden;background:var(--km-pf-bg,#EDE6D4);perspective:1000px;">
  <style>
    .km-pf__bg { position:absolute; inset:0;
      background:linear-gradient(165deg, #F1EADB 0%, #E9E1CE 52%, #DFD3B9 100%); }
    /* 全局纸纹 overlay：feTurbulence data-uri，正片叠底 12%（固定 seed，确定性） */
    .km-pf__texture { position:absolute; inset:0; mix-blend-mode:multiply; opacity:.12;
      background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='pfn'><feTurbulence type='fractalNoise' baseFrequency='0.7' numOctaves='3' seed='23' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='300' height='300' filter='url(%23pfn)' opacity='0.6'/></svg>");
      background-size:300px 300px; pointer-events:none; }
    .km-pf__title { position:absolute; left:0; top:7%; width:100%; text-align:center;
      font:800 52px "Noto Sans SC","PingFang SC",sans-serif; color:#26241F; letter-spacing:.02em; }
    /* 折纸元件通用：preserve-3d 让厚度侧面随 rotateX 一起翻转 */
    .km-pf__part { position:absolute; transform-style:preserve-3d; transform-origin:50% 100%;
      box-shadow:0 22px 34px rgba(60,50,30,.20); backface-visibility:hidden; }
    /* 折痕：折点处深色阴影线 + 高光线 */
    .km-pf__part::before { content:""; position:absolute; left:0; right:0; bottom:-2px; height:4px;
      background:linear-gradient(to top, rgba(40,32,18,.35), rgba(40,32,18,0) 70%); z-index:2; }
    .km-pf__part::after { content:""; position:absolute; left:2%; right:2%; bottom:0; height:1.5px;
      background:rgba(255,252,240,.75); z-index:2; }
    /* 厚度侧面：同色系稍暗，垂在折点下方，立起后可见 */
    .km-pf__edge { position:absolute; left:0; right:0; top:100%; height:12px; transform-origin:top;
      transform:rotateX(-90deg); background:var(--km-pf-edge,#C9BB9C); }
    /* 各元件：低饱和纸本色/莫兰迪系 */
    .km-pf__base { left:12%; top:38%; width:76%; height:46%; background:#DCCFB2; --km-pf-edge:#BFB08D; }
    .km-pf__mid  { left:19%; top:26%; width:62%; height:34%; background:#F3EDDD; --km-pf-edge:#D8CDAF; }
    .km-pf__flapL { left:14%; top:44%; width:38%; height:30%; background:#E7D9BC; --km-pf-edge:#C6B48D; }
    .km-pf__flapR { left:52%; top:46%; width:34%; height:26%; background:#E2D2B4; --km-pf-edge:#C0AE86; }
    .km-pf__tab  { left:41%; top:20%; width:18%; height:12%; background:var(--km-pf-accent,#C97B5A);
      --km-pf-edge:#A05D3E; box-shadow:0 14px 22px rgba(60,50,30,.24); }
    .km-pf__tab .km-pf__edge { background:#A05D3E; }
    .km-pf__face { position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
      font:700 30px "Noto Sans SC","PingFang SC",sans-serif; color:#26241F; padding:0 6%; text-align:center; }
    .km-pf__tab .km-pf__face { color:#FBF7EC; font-weight:800; }
    /* 顶层面板的素材窗口：photo-1 贴图；缺失时 onerror 移除 <img>，保留 CSS 色块兜底 */
    .km-pf__ph { position:absolute; inset:10%; background:rgba(38,36,31,.85); display:flex;
      align-items:center; justify-content:center; color:#8C887F;
      font:600 22px "Noto Sans SC","PingFang SC",sans-serif; overflow:hidden; }
    .km-pf__ph img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  </style>

  <div class="km-pf__bg"></div>
  <div class="km-pf__texture" data-layout-ignore></div>
  <div class="km-pf__title">{{TITLE}}</div>

  <!-- 后 → 前、大 → 小装配：base（最大/最后） → mid → flapL/flapR → tab（最小/最前） -->
  <div class="km-pf__part km-pf__base" id="km-pf-base">
    <div class="km-pf__edge"></div>
    <div class="km-pf__face" style="color:#8C887F;">{{LAYER_3_LABEL}}</div>
  </div>
  <div class="km-pf__part km-pf__mid" id="km-pf-mid">
    <div class="km-pf__edge"></div>
    <div class="km-pf__face">{{LAYER_2_LABEL}}</div>
  </div>
  <div class="km-pf__part km-pf__flapL" id="km-pf-flap-l">
    <div class="km-pf__edge"></div>
    <div class="km-pf__face">{{LAYER_1_LABEL}}</div>
  </div>
  <div class="km-pf__part km-pf__flapR" id="km-pf-flap-r">
    <div class="km-pf__edge"></div>
    <div class="km-pf__face" style="font-size:26px;">{{LAYER_2_LABEL}}</div>
  </div>
  <div class="km-pf__part km-pf__tab" id="km-pf-tab">
    <div class="km-pf__edge"></div>
    <div class="km-pf__ph">
      <div>photo-1 占位</div>
      <img src="assets/media/photo-1.jpg" alt="" onerror="this.remove()">
    </div>
  </div>
</div>
<!--
  GSAP timeline fragment (deterministic; times scene-relative; first element in by 0.2s).
  立起方向: transform-origin 固定折点（50% 100%），rotateX 由平铺(≈88deg，几乎侧视不可见)
  转到立起(10–22deg 微仰角，正对观众并保留 3D 透视感)，ease power2.inOut 模拟纸张阻力——
  即设计 §1.2 的"平铺→立起"。终态保留小角度倾角，否则所有元件共面会读作平面贴纸。
  装配顺序: 由后到前、由大到小（base → mid → flaps → tab）。
  SFX 挂点: 翻纸/纸张摩擦声 → 每个元件立起起点（0.15 / 0.9 / 1.5 / 1.8 / 2.4s）。

  tl.fromTo("#km-pf-base", { autoAlpha: 0, y: 60 },
      { autoAlpha: 1, y: 0, duration: 0.5, ease: "power2.inOut" }, 0.15)                     // SFX paper
    .fromTo("#km-pf-base", { rotationX: 88 }, { rotationX: 0, duration: 0.7,
      ease: "power2.inOut", immediateRender: false }, 0.25)                                  // SFX fold
    .fromTo("#km-pf-mid", { autoAlpha: 0, y: 50 },
      { autoAlpha: 1, y: 0, duration: 0.45, ease: "power2.inOut" }, 0.9)                     // SFX paper
    .fromTo("#km-pf-mid", { rotationX: 88 }, { rotationX: 10, duration: 0.6,
      ease: "power2.inOut", immediateRender: false }, 1.0)                                   // SFX fold
    .fromTo("#km-pf-flap-l", { rotationX: 88 }, { rotationX: 16, duration: 0.55,
      ease: "power2.inOut" }, 1.5)                                                           // SFX fold
    .fromTo("#km-pf-flap-r", { rotationX: 88 }, { rotationX: 18, duration: 0.55,
      ease: "power2.inOut" }, 1.8)                                                           // SFX fold
    .fromTo("#km-pf-tab", { rotationX: 88 }, { rotationX: 22, duration: 0.5,
      ease: "power2.inOut" }, 2.4)                                                           // SFX fold
    .fromTo(".km-pf__title", { autoAlpha: 0, y: 24 },
      { autoAlpha: 1, y: 0, duration: 0.4, ease: "power3.out" }, 0.2);
  // 立起后的"纸张回弹"（有限、显式；同一元件的二次 fromTo 必须带 immediateRender:false）:
  // tl.fromTo("#km-pf-flap-l", { rotationX: 0 }, { rotationX: -5, duration: 0.18,
  //   ease: "power1.inOut", immediateRender: false, transformOrigin: "50% 100%" }, 2.05)
  //   .to("#km-pf-flap-l", { rotationX: 0, duration: 0.25, ease: "power1.inOut" }, 2.23);
  // 立起揭示下层（真实遮挡，铰链在下缘）:
  // tl.to("#km-pf-mid", { rotationX: -38, y: -30, duration: 0.6, ease: "power2.inOut",
  //   transformOrigin: "50% 100%" }, 3.0);
-->
