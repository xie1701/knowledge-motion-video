<!--
  Route: generated-cinematic (生成式电影感)
  Paste the <div> below into one clip inside your composition root.
  Replaceable slots: {{QUOTE}} 叠加短句 | {{ACCENT}} 强调色 | media-1 素材槽位
  注意：这条风格的前提是有「拍出来的」或「生成出来的」影像。自动检索只能保证有素材、
  不保证有摄影感（实测检索会返论文插图，渲染出来像幻灯片截图）。要真正的电影感，
  请用 --local-dir 放自己拍的/生成的素材，或把生成的静帧塞进 media-1 槽位。
  Replace .km-cine__media placeholder with a local generated <video muted playsinline
  data-...> clip — the framework owns playback; never drive <video> with GSAP.
  （管线自动档会往 media-1 槽位检索一张静帧，缺失时保留渐变+环层兜底。）
  Keep camera restrained: one push OR one pull, nothing else. No facts on screen.
-->
<div class="km-cine" style="position:relative;width:100%;height:100%;overflow:hidden;background:#000000;">
  <!-- 生成媒体容器：全出血子元素，贴入本地 <video> 或生成的 <img> -->
  <div class="km-cine__media" style="position:absolute;inset:0;background:radial-gradient(120% 90% at 50% 30%, #2A2E38 0%, #0B0D12 70%);display:flex;align-items:center;justify-content:center;">
    <!-- 素材层：真实照片/生成静帧铺满；缺失时 onerror 移除，露出下方渐变与环层 -->
    <img class="km-cine__img" src="assets/media/media-1.jpg" alt="" onerror="this.remove()"
         style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.85;filter:saturate(.5) contrast(1.12) brightness(.62);">
    <svg width="280" height="280" viewBox="0 0 280 280" fill="none">
      <circle cx="140" cy="140" r="90" stroke="#3A4050" stroke-width="2"/>
      <circle cx="140" cy="140" r="60" stroke="#4A5164" stroke-width="2"/>
      <circle class="km-cine__core" cx="140" cy="140" r="24" fill="var(--km-accent,#F36B3D)" opacity="0.9"/>
    </svg>
  </div>
  <!-- 调色层：冷色压暗（把任何一张素材拉进「氛围影像」的语气，同时保证叠加文字可读） -->
  <div class="km-cine__grade" style="position:absolute;inset:0;mix-blend-mode:multiply;background:linear-gradient(165deg, #1B2233 0%, #0C1018 100%);opacity:.55;"></div>
  <!-- 轻暗角，保证文字可读 -->
  <div class="km-cine__vignette" style="position:absolute;inset:0;background:linear-gradient(to top, rgba(0,0,0,.82) 0%, rgba(0,0,0,.45) 26%, rgba(0,0,0,.10) 52%, rgba(0,0,0,0) 72%);"></div>
  <div class="km-cine__quote" style="position:absolute;left:10%;bottom:18%;width:80%;font:700 40px system-ui;color:#F5F1E8;text-shadow:0 2px 12px rgba(0,0,0,.6);">
    {{QUOTE}}
  </div>
</div>
<!--
  GSAP timeline fragment (deterministic; media playback belongs to the framework):
  tl.fromTo(".km-cine__media", { scale: 1.06 }, { scale: 1, duration: 2.4, ease: "power1.out" }, 0)
    .fromTo(".km-cine__vignette", { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.6 }, 0.2)
    .fromTo(".km-cine__quote", { autoAlpha: 0, y: 20 }, { autoAlpha: 1, y: 0, duration: 0.5, ease: "power2.out" }, 1.2);
  // Exit: fade the whole clip via the framework's transition, or:
  // tl.to(".km-cine__quote", { autoAlpha: 0, duration: 0.3 }, 5.2);
  // Use sparingly: no labels, no recurring characters, no facts.
// @beats enter=0.00 build=0.20 reveal=1.20 peak=1.20 settle=5.20
// 锚点语义：enter 画面起 / build 渐晕 / reveal 引文 / peak 引文压住 / settle 缓慢推近收尾

-->
