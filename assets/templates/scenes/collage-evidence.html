<!--
  Route: collage-evidence (编辑拼贴·证据墙, 1080×1920 竖屏)
  Paste the <div> below into one clip inside your composition root.
  适用题材: 证据/档案/历史/人物/新闻报道类 beat——需要"真实照片上墙"的拼贴论证。
  素材槽位 (scenes.json scene.assets, 设计文档 §2.1 约定):
    photo-1 → {{assets.photo-1}} 主证据照（左上大卡）
    photo-2 → {{assets.photo-2}} 对照照（右上小卡）
    photo-3 → {{assets.photo-3}} 文献/档案照（左下卡）
    photo-4 → {{assets.photo-4}} 细节照（右下小卡）
    每张 <img src="assets/media/photo-N.jpg" onerror="this.remove()">：素材缺失时
    onerror 移除 <img>，露出下方 CSS 色块兜底层，画面永不空屏。
  Replaceable slots: {{TITLE}} 档案标签 | {{CAPTION_1}}/{{CAPTION_2}} 图注 | {{ACCENT}} 强调色
  音效挂点 (fetch_assets.py --sfx):
    快门/翻纸声 → 每张照片卡平移切入的起点（见 GSAP 注释 SFX 标记）
    纸张摩擦声 → caption box 压上图面的瞬间
  Assemble inside a 1080×1920 composition: local @font-face (PingFang SC/Noto Sans SC),
  a full-duration #furniture-base clip, vendor/gsap.min.js relative script, and keep all
  text above y=1690 (bottom 230px caption safe area). See examples/style-samples/.
-->
<div class="km-ev" style="position:relative;width:100%;height:100%;overflow:hidden;background:var(--km-ev-bg,#EFE7D6);">
  <style>
    /* —— 米色纸纹底：CSS 渐变 + 噪点近似，无外部图片 —— */
    .km-ev__bg { position:absolute; inset:0;
      background:
        radial-gradient(1200px 800px at 20% 10%, rgba(255,253,246,.9), transparent 60%),
        radial-gradient(1000px 900px at 85% 85%, rgba(210,196,168,.55), transparent 65%),
        linear-gradient(160deg, #F2EBDC 0%, #E9DFC9 55%, #E2D6BC 100%); }
    .km-ev__grain { position:absolute; inset:0; opacity:.35; mix-blend-mode:multiply;
      background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='260' height='260'><filter id='evn'><feTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='2' seed='11' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='260' height='260' filter='url(%23evn)' opacity='0.5'/></svg>");
      background-size:260px 260px; }
    /* —— 撕纸毛边：SVG 感不规则 polygon clip-path ×4 变体 —— */
    .km-ev__card { position:absolute; filter:drop-shadow(16px 18px 20px rgba(38,36,31,.3)); }
    .km-ev__tear { width:100%; height:100%; background:var(--km-ev-paper,#FBF7EC); position:relative; }
    .km-ev__tear--a { clip-path:polygon(0% 3%,4% 1%,9% 4%,15% 2%,22% 5%,30% 1%,38% 4%,47% 2%,55% 5%,63% 2%,72% 4%,80% 1%,88% 4%,95% 2%,100% 5%,99% 14%,100% 24%,98% 34%,100% 44%,99% 55%,100% 66%,98% 77%,100% 88%,99% 96%,94% 99%,86% 97%,77% 100%,68% 97%,58% 100%,48% 98%,38% 100%,28% 97%,18% 100%,10% 98%,4% 100%,1% 92%,2% 81%,0% 70%,2% 59%,0% 48%,2% 37%,0% 26%,1% 14%); }
    .km-ev__tear--b { clip-path:polygon(2% 0%,10% 3%,19% 1%,28% 4%,37% 0%,46% 3%,56% 1%,65% 4%,74% 0%,83% 3%,92% 1%,100% 4%,98% 13%,100% 23%,97% 33%,99% 43%,98% 54%,100% 64%,97% 75%,99% 86%,98% 95%,92% 98%,83% 100%,73% 98%,63% 100%,53% 97%,43% 100%,33% 98%,23% 100%,14% 98%,6% 100%,0% 94%,2% 83%,0% 72%,2% 61%,0% 50%,2% 39%,0% 28%,1% 17%,0% 8%); }
    .km-ev__tear--c { clip-path:polygon(1% 4%,7% 0%,14% 5%,23% 2%,31% 6%,40% 2%,49% 5%,58% 1%,67% 5%,76% 2%,85% 5%,93% 1%,100% 3%,99% 12%,97% 22%,100% 32%,98% 43%,100% 53%,97% 64%,99% 74%,98% 85%,100% 94%,93% 98%,84% 100%,74% 97%,64% 100%,54% 98%,44% 100%,34% 97%,24% 100%,15% 98%,7% 100%,0% 95%,2% 85%,0% 74%,2% 63%,0% 52%,2% 41%,0% 30%,1% 19%,0% 10%); }
    .km-ev__tear--d { clip-path:polygon(0% 2%,8% 5%,17% 2%,26% 5%,35% 1%,45% 4%,54% 2%,64% 5%,73% 1%,82% 4%,91% 2%,100% 5%,98% 15%,100% 25%,97% 35%,99% 45%,97% 56%,100% 66%,98% 76%,99% 87%,97% 96%,89% 99%,79% 97%,69% 100%,59% 98%,49% 100%,39% 97%,29% 100%,19% 98%,9% 100%,2% 97%,0% 88%,2% 78%,0% 67%,2% 56%,0% 45%,2% 34%,0% 23%,1% 12%); }
    /* 照片卡内部：CSS 色块兜底层 + <img> 素材层（缺失即被移除） */
    .km-ev__ph { position:absolute; inset:4%; background:
        linear-gradient(135deg, rgba(255,255,255,.06), transparent 55%),
        var(--km-ev-tone,#2B2822); display:flex; align-items:center; justify-content:center;
      color:#8C887F; font:600 24px/1.4 "Noto Sans SC","PingFang SC",sans-serif; text-align:center;
      overflow:hidden; }
    .km-ev__img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
    /* 档案式标签（编号/时间戳） */
    .km-ev__tag { position:absolute; top:10px; left:14px; background:#26241F; color:#F5F1E8;
      padding:4px 12px; font:700 20px ui-monospace,SFMono-Regular,monospace; letter-spacing:.08em; z-index:3; }
    /* caption box：色块压字，保证图面上可读 */
    .km-ev__cap { position:absolute; left:6%; right:6%; bottom:7%; background:var(--km-ev-accent,#E34234);
      color:#FBF7EC; padding:8px 16px; font:800 30px "Noto Sans SC","PingFang SC",sans-serif;
      line-height:1.25; z-index:3; box-shadow:0 8px 18px rgba(38,36,31,.25); }
    .km-ev__cap--ink { background:#26241F; }
    /* 手帐箭头（视线引导） */
    .km-ev__arrow { position:absolute; z-index:2; }
    /* 中心聚焦区外的档案标签贴纸 */
    .km-ev__stamp { position:absolute; right:7%; top:8.5%; background:var(--km-ev-accent,#E34234);
      color:#FBF7EC; padding:10px 24px; font:800 30px "Noto Sans SC","PingFang SC",sans-serif;
      letter-spacing:.06em; transform:rotate(3deg); box-shadow:0 10px 24px rgba(38,36,31,.22); z-index:4; }
  </style>

  <div class="km-ev__bg"></div>
  <div class="km-ev__grain" data-layout-ignore></div>

  <!-- 卡 A：主证据照 photo-1（左上，tear-a，caption 压字） -->
  <div class="km-ev__card" id="km-ev-card-a" style="left:5%;top:15%;width:54%;height:36%;transform:rotate(-2deg);">
    <div class="km-ev__tear km-ev__tear--a">
      <div class="km-ev__ph">photo-1<br/>素材占位</div>
      <img class="km-ev__img" src="assets/media/photo-1.jpg" alt="" onerror="this.remove()">
      <div class="km-ev__tag">NO.01 / 1998-03</div>
      <div class="km-ev__cap">{{CAPTION_1}}</div>
    </div>
  </div>
  <!-- 卡 B：对照照 photo-2（右上，tear-b） -->
  <div class="km-ev__card" id="km-ev-card-b" style="left:63%;top:19%;width:32%;height:26%;transform:rotate(2.5deg);">
    <div class="km-ev__tear km-ev__tear--b">
      <div class="km-ev__ph" style="--km-ev-tone:#3A362E;">photo-2</div>
      <img class="km-ev__img" src="assets/media/photo-2.jpg" alt="" onerror="this.remove()">
      <div class="km-ev__tag">NO.02</div>
    </div>
  </div>
  <!-- 卡 C：文献照 photo-3（左下，tear-c，ink caption） -->
  <div class="km-ev__card" id="km-ev-card-c" style="left:9%;top:55%;width:46%;height:30%;transform:rotate(1.5deg);">
    <div class="km-ev__tear km-ev__tear--c">
      <div class="km-ev__ph" style="--km-ev-tone:#4A443A;">photo-3</div>
      <img class="km-ev__img" src="assets/media/photo-3.jpg" alt="" onerror="this.remove()">
      <div class="km-ev__tag">NO.03 / ARCHIVE</div>
      <div class="km-ev__cap km-ev__cap--ink">{{CAPTION_2}}</div>
    </div>
  </div>
  <!-- 卡 D：细节照 photo-4（右下，tear-d） -->
  <div class="km-ev__card" id="km-ev-card-d" style="left:60%;top:57%;width:34%;height:27%;transform:rotate(-3deg);">
    <div class="km-ev__tear km-ev__tear--d">
      <div class="km-ev__ph" style="--km-ev-tone:#57503F;">photo-4</div>
      <img class="km-ev__img" src="assets/media/photo-4.jpg" alt="" onerror="this.remove()">
      <div class="km-ev__tag">NO.04</div>
    </div>
  </div>

  <!-- 档案标签贴纸 + 手帐箭头（视线引导 A→D） -->
  <div class="km-ev__stamp">{{TITLE}}</div>
  <svg class="km-ev__arrow" id="km-ev-arrow" style="left:47%;top:47%;width:20%;height:14%;" viewBox="0 0 200 120" fill="none">
    <path d="M8 100 C 60 90, 120 60, 178 22" stroke="#26241F" stroke-width="8" stroke-linecap="round"/>
    <path d="M150 18 L182 20 L172 50" stroke="#26241F" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>
</div>
<!--
  GSAP timeline fragment (deterministic; times scene-relative; first element in by 0.2s;
  every second fromTo on the same element carries immediateRender:false).
  运动规范（设计 §1.1）: 边缘平移切入 + 0.3s 快速缩放，全 ease-in-out 家族（power2.inOut / power3.out）。
  SFX 挂点: 快门/翻纸声 → 每张卡入场起点; 纸摩擦声 → caption 落位（0.9s/2.1s 附近）。

  tl.fromTo("#km-ev-card-a", { autoAlpha: 0, x: -90 },
      { autoAlpha: 1, x: 0, duration: 0.45, ease: "power2.inOut" }, 0.15)                    // SFX shutter
    .fromTo("#km-ev-card-a", { scale: 1.06 }, { scale: 1, duration: 0.3, ease: "power3.out",
      immediateRender: false, transformOrigin: "50% 50%" }, 0.6)
    .fromTo("#km-ev-card-b", { autoAlpha: 0, x: 90 },
      { autoAlpha: 1, x: 0, duration: 0.45, ease: "power2.inOut" }, 0.55)                    // SFX shutter
    .fromTo("#km-ev-card-b", { scale: 1.06 }, { scale: 1, duration: 0.3, ease: "power3.out",
      immediateRender: false, transformOrigin: "50% 50%" }, 1.0)
    .fromTo("#km-ev-card-c", { autoAlpha: 0, x: -90 },
      { autoAlpha: 1, x: 0, duration: 0.45, ease: "power2.inOut" }, 0.95)                    // SFX shutter
    .fromTo("#km-ev-card-c", { scale: 1.06 }, { scale: 1, duration: 0.3, ease: "power3.out",
      immediateRender: false, transformOrigin: "50% 50%" }, 1.4)
    .fromTo("#km-ev-card-d", { autoAlpha: 0, x: 90 },
      { autoAlpha: 1, x: 0, duration: 0.45, ease: "power2.inOut" }, 1.35)                    // SFX shutter
    .fromTo("#km-ev-card-d", { scale: 1.06 }, { scale: 1, duration: 0.3, ease: "power3.out",
      immediateRender: false, transformOrigin: "50% 50%" }, 1.8)
    .fromTo(".km-ev__stamp", { autoAlpha: 0, scale: 1.5, rotation: 8 },
      { autoAlpha: 1, scale: 1, rotation: 3, duration: 0.3, ease: "power3.out" }, 0.35)
    .fromTo("#km-ev-arrow path", { autoAlpha: 0, scale: 0.6 },
      { autoAlpha: 1, scale: 1, duration: 0.3, ease: "power2.inOut", stagger: 0.15,
        transformOrigin: "0% 50%" }, 2.0)
    .fromTo("#km-ev-card-a .km-ev__cap", { autoAlpha: 0, y: 16 },
      { autoAlpha: 1, y: 0, duration: 0.3, ease: "power3.out" }, 2.1)                        // SFX paper-rub
    .fromTo("#km-ev-card-c .km-ev__cap", { autoAlpha: 0, y: 16 },
      { autoAlpha: 1, y: 0, duration: 0.3, ease: "power3.out" }, 2.5)                        // SFX paper-rub
