<!--
  Route: hand-sketch (瑞士手绘特效, 1080×1920 竖屏)
  Paste the <div> below into one clip inside your composition root.
  适用题材: 论证/对比/方法/商业与社会评论——"线条被画出"的克制手绘论证 beat。
  素材槽位 (scenes.json scene.assets, 设计文档 §2.1 约定):
    photo-1 → {{assets.photo-1}} 嵌入照片（相框）；缺失时 onerror 移除 <img>，
               保留 CSS 色块相框兜底，画面永不空屏。
  Replaceable slots: {{HEADLINE}} 大标题 | {{POINT_1}}/{{POINT_2}} 论点（thesis）
    | {{LINE_A}}/{{LINE_B}} 对照两行（contrast）| {{BIGNUM}}/{{BIGNUM_LABEL}}/{{BIGNUM_LINE}} 数字主角（number）
    | {{STEP_NO}}/{{STEP_PCT}}/{{STEP_TICKS}} 步骤进度（step）| {{PHOTO_CAP}} 图注
  版面变体（{{VARIANT}}，由 make_video.py 的 choose_variant 逐场挑；五套轮廓互不相同）:
    thesis    默认：标题 + 两条论点 + 右侧相框
    statement 一句话大片：标题放大居中，照片横贯底部
    contrast  上下两行对看：上行描边空心 → 下行实心 + 强调下划线
    step      步骤进度：五格进度条 + 巨号步序 + 步骤名 + 照片横带
    number    数字主角：巨号数字 + 单位标签 + 一行说明 + 小相框
  核心实现（设计 §1.3）:
    - SVG stroke-dasharray/dashoffset 描边动画，线被"画出"
    - 笔尖圆点沿 path 同步移动: vendor 只有 gsap.min.js 3.14.2 核心（无 MotionPathPlugin），
      用 getPointAtLength + onUpdate 手动实现，见下方 GSAP 注释中的 kmSketchPen 助手（零新增依赖）
    - feTurbulence 轻微置换（固定 seed，确定性）让线条带手感
    - 严格网格、大面积留白、黑/米白 + 单强调色（红橙 #E34234 附近）、粗黑标题
  音效挂点 (fetch_assets.py --sfx): 笔尖沙沙声 → 每段描边动画起点（见 GSAP 注释 SFX 标记）。
  Assemble inside a 1080×1920 composition: local @font-face (PingFang SC/Noto Sans SC),
  a full-duration #furniture-base clip, vendor/gsap.min.js relative script, and keep all
  text above y=1690 (bottom 230px caption safe area). See examples/style-samples/.
-->
<div class="km-sk {{HEAD_CLASS}} {{POINT_CLASS}}" data-km-variant="{{VARIANT}}" style="position:relative;width:100%;height:100%;overflow:hidden;background:var(--km-sk-bg,#F4EFE6);">
  <style>
    .km-sk__grid { position:absolute; inset:-8%; opacity:.10; pointer-events:none;
      background-image:
        linear-gradient(to right, #11110F 1px, transparent 1px),
        linear-gradient(to bottom, #11110F 1px, transparent 1px);
      background-size:120px 120px; background-position:60px 60px; }
    .km-sk__mark { position:absolute; left:7%; top:6.5%; z-index:2; }
    .km-sk__headline { position:absolute; left:8%; top:13%; width:84%; z-index:2;

      background:var(--km-sk-accent,#E34234); transform-origin:left; }

    .km-sk__photo { position:absolute; z-index:1; background:var(--km-sk-tone,#26241F);
      border:3px solid #11110F; display:flex; align-items:center; justify-content:center;

    .km-sk__photocap { position:absolute; left:8%; z-index:2;

    /* 手绘层：feTurbulence 轻微置换（scale 3，固定 seed 17 → 确定性） */
    .km-sk__drawing { position:absolute; inset:0; width:100%; height:100%; z-index:3; pointer-events:none; }

    /* ---------- 每套版面的专属分组：默认全部隐藏，由当前变体打开 ---------- */

    .km-sk[data-km-variant="thesis"] .km-sk__ink--thesis,
    .km-sk[data-km-variant="statement"] .km-sk__ink--statement,
    .km-sk[data-km-variant="contrast"] .km-sk__ink--contrast,
    .km-sk[data-km-variant="step"] .km-sk__ink--step,

    /* ---------- contrast：上行旧做法（描边空心）→ 下行新结论（实心 + 强调线） ---------- */
    .km-sk[data-km-variant="contrast"] .km-sk__headline {

    .km-sk__trackline { position:relative; height:10px; background:rgba(17,17,15,.14); }

    .km-sk[data-km-variant="step"] .km-sk__headline {
      top:46%; font:900 68px/1.16 "Noto Sans SC","PingFang SC",sans-serif; width:80%; }
    .km-sk[data-km-variant="step"] .km-sk__photo { left:8%; top:62%; width:84%; height:20%; }
    .km-sk[data-km-variant="step"] .km-sk__photocap { top:84.5%; }

    /* ---------- number：巨号数字 + 标签 + 一行说明 + 小相框 ---------- */
    .km-sk[data-km-variant="number"] .km-sk__headline {
      top:11%; font:900 70px/1.14 "Noto Sans SC","PingFang SC",sans-serif; width:78%; }
    .km-sk__bignum { position:absolute; left:8%; top:25%; z-index:2;
      font:900 200px/1 "Noto Sans SC","PingFang SC",sans-serif; color:#11110F;
      letter-spacing:-.05em; white-space:nowrap; }
    .km-sk__bignumlabel { position:absolute; left:8%; top:41.5%; width:78%; z-index:2;
      font:700 44px/1.2 "Noto Sans SC","PingFang SC",sans-serif; color:var(--km-sk-accent,#E34234); }
    .km-sk__bignumline { position:absolute; left:8%; top:48%; width:78%; z-index:2;

    .km-sk[data-km-variant="number"] .km-sk__photo { left:60%; top:64%; width:32%; height:18%; }
    .km-sk[data-km-variant="number"] .km-sk__photocap { top:84%; left:60%; }
  </style>

  <!-- 照片相框（素材层）+ 图注 -->

  <div class="km-sk__photo" data-km-push="2" data-hide-when-empty id="km-sk-photo">

  <!-- 手绘 SVG：全部线条走 dashoffset 描边动画；feTurbulence 置换加手感。
       每套版面一组 ink，只有当前变体那一组可见（CSS 控制），笔尖沿本组的线走。 -->
  <svg class="km-sk__drawing" viewBox="0 0 1080 1920" fill="none" preserveAspectRatio="xMidYMid slice">

<!--
  GSAP timeline fragment (deterministic; times scene-relative; first element in by 0.2s;
  second fromTo on the same element carries immediateRender:false).

  笔尖助手（两个纯函数，内部**不含任何 tween**；vendor 无 MotionPathPlugin，手动 along-path）:
    kmPenLen(path)  记录并返回路径长度，同时把描边收到 0 长度
    kmPenTick(pen)  返回 onUpdate 回调：用 tween 自身的 progress 推算描边进度与笔尖状态
  「何时画、画多久」必须留在 tween 的参数里：重定时器只认真正的 tween 位置参数，把时长藏进
  一个普通函数调用，它会被当成位置参数重新映射（实测 0.60 → 9.26，跨过一个 2.46s 场景），
  于是描边永远「还在画」、笔尖回调不触发，一枚墨点就留在照片上。
  function kmPenLen(path) {
    const len = path.getTotalLength();
    path.style.strokeDasharray = len;
    path.style.strokeDashoffset = len;
    return len;
  }
  function kmPenTick(pen) {
    return function () {
      const path = this.targets()[0];
      const len = parseFloat(path.style.strokeDasharray) || 1;
      const at = this.progress();
      path.style.strokeDashoffset = String(len * (1 - at));
      // 笔尖的显隐同样是时间的函数（progress 0/1 → 藏起来），不依赖 onStart/onComplete：
      // seek 型渲染器不保证回调跑到。
      const on = at > 0 && at < 1;
      pen.style.opacity = on ? "1" : "0";
      if (on) {
        const pt = path.getPointAtLength(Math.max(0.001, len * at));
        pen.setAttribute("cx", pt.x);
        pen.setAttribute("cy", pt.y);
      }
    };
  }
  渲染器要求: 状态写入发生在 tween 的 onUpdate 回调内，渲染器跳转时必须 seek(t, false)（不抑制回调）——
  本 skill 的 scripts/render-browser.mjs seekRuntime 已如此实现；HyperFrames 同理。

  SFX 挂点: 笔尖沙沙声 → 每段描边 tween 的起点。

  const pen = document.querySelector("#km-sk-pen");
  // 查询必须从**笔尖所在的本场根元素**出发（理由见 swiss-sketch 同名注释）：写成
  // document.querySelectorAll 时，每个场景块拿到的都是全文档第一个可见的墨迹组，
  // 本场的线从未被设过 dasharray —— 线条从第一帧就是画完的，「被画出来」从未发生。
  const sceneRoot = pen ? pen.closest(".km-sk") : null;
  const inkGroups = sceneRoot ? Array.from(sceneRoot.querySelectorAll(".km-sk__inkgroup")) : [];
  const activeInk = inkGroups.filter(function (g) { return getComputedStyle(g).display !== "none"; })[0];
  const strokes = activeInk ? Array.from(activeInk.querySelectorAll(".km-sk__stroke")) : [];
  const penTick = kmPenTick(pen);
  tl.fromTo(".km-sk__markring", { scale: 0, autoAlpha: 0, svgOrigin: "22 22" },
      { scale: 1, autoAlpha: 1, duration: 0.3, ease: "power3.out" }, 0.15)
    .fromTo(".km-sk__markline", { autoAlpha: 0, scale: 0.4, svgOrigin: "22 22" },
      { autoAlpha: 1, scale: 1, duration: 0.3, ease: "power2.inOut", stagger: 0.08 }, 0.25)
    .fromTo(".km-sk__headline", { autoAlpha: 0, y: 30 },
      { autoAlpha: 1, y: 0, duration: 0.45, ease: "power3.out" }, 0.35)
    .fromTo(".km-sk__point--1", { autoAlpha: 0, x: -24 },
      { autoAlpha: 1, x: 0, duration: 0.35, ease: "power2.inOut" }, 0.8)
    .fromTo(".km-sk__accentbar", { scaleX: 0 }, { scaleX: 1, duration: 0.35,
      ease: "power2.inOut" }, 0.9)
    .fromTo(".km-sk__point--2", { autoAlpha: 0, x: -24 },
      { autoAlpha: 1, x: 0, duration: 0.35, ease: "power2.inOut" }, 1.2)
    .fromTo(".km-sk__line--a", { autoAlpha: 0, x: -30 },
      { autoAlpha: 0.62, x: 0, duration: 0.4, ease: "power2.out" }, 0.7)
    .fromTo(".km-sk__line--b", { autoAlpha: 0, x: -30 },
      { autoAlpha: 1, x: 0, duration: 0.4, ease: "power2.out" }, 1.1)
    .fromTo(".km-sk__underline", { scaleX: 0 }, { scaleX: 1, duration: 0.45,
      ease: "power2.inOut" }, 1.5)
    .fromTo(".km-sk__stepno", { autoAlpha: 0, y: 40 },
      { autoAlpha: 1, y: 0, duration: 0.45, ease: "power3.out" }, 0.7)
    .fromTo(".km-sk__trackfill", { scaleX: 0 }, { scaleX: 1, duration: 0.7,
      ease: "power2.inOut" }, 1.3)
    .fromTo(".km-sk__trackknob", { autoAlpha: 0, scale: 0 },
      { autoAlpha: 1, scale: 1, duration: 0.3, ease: "back.out(2)", immediateRender: false,
        transformOrigin: "50% 50%" }, 2.0)
    .fromTo(".km-sk__bignum", { autoAlpha: 0, y: 40 },
      { autoAlpha: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.6)
    .fromTo(".km-sk__bignumlabel", { autoAlpha: 0, y: 20 },
