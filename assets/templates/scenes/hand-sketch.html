<!--
  Route: hand-sketch (瑞士手绘特效, 1080×1920 竖屏)
  Paste the <div> below into one clip inside your composition root.
  适用题材: 论证/对比/方法/商业与社会评论——"线条被画出"的克制手绘论证 beat。
  素材槽位 (scenes.json scene.assets, 设计文档 §2.1 约定):
    photo-1 → {{assets.photo-1}} 嵌入照片（右侧相框）；缺失时 onerror 移除 <img>，
               保留 CSS 色块相框兜底，画面永不空屏。
  Replaceable slots: {{HEADLINE}} 大标题 | {{POINT_1}}/{{POINT_2}} 论点 | {{PHOTO_CAP}} 照片图注
  核心实现（设计 §1.3）:
    - SVG stroke-dasharray/dashoffset 描边动画，线被"画出"
    - 笔尖圆点沿 path 同步移动: vendor 只有 gsap.min.js 3.14.2 核心（无 MotionPathPlugin），
      用 getPointAtLength + onUpdate 手动实现，见下方 GSAP 注释中的 kmSketchPen 助手（零新增依赖）
    - feTurbulence 轻微置换（固定 seed，确定性）让线条带手感
    - 严格网格、大面积留白、黑/米白 + 单强调色（红橙 #E34234 附近）、粗黑标题
  音效挂点 (fetch_assets.py --sfx): 笔尖沙沙声 → 每段描边动画起点（见 GSAP 注释 SFX 标记）。
  Assemble inside a 1080×1920 composition: local @font-face (PingFang SC/Noto Sans SC),
  a full-duration #furniture-base clip, vendor/gsap.min.js relative script, and keep all
  text above y=1690 (bottom 230px caption safe area). See examples/style-samples/.
-->
<div class="km-sk" style="position:relative;width:100%;height:100%;overflow:hidden;background:var(--km-sk-bg,#F4EFE6);">
  <style>
    .km-sk__grid { position:absolute; inset:0; opacity:.10; pointer-events:none;
      background-image:
        linear-gradient(to right, #11110F 1px, transparent 1px),
        linear-gradient(to bottom, #11110F 1px, transparent 1px);
      background-size:120px 120px; background-position:60px 60px; }
    .km-sk__mark { position:absolute; left:7%; top:6.5%; z-index:2; }
    .km-sk__headline { position:absolute; left:10%; top:13%; width:80%; z-index:2;
      font:900 88px/1.12 "Noto Sans SC","PingFang SC",sans-serif; color:#11110F;
      letter-spacing:-.02em; }
    .km-sk__point { position:absolute; left:10%; z-index:2;
      font:700 38px "Noto Sans SC","PingFang SC",sans-serif; color:#11110F; }
    .km-sk__point::before { content:""; display:inline-block; width:22px; height:22px;
      background:var(--km-sk-accent,#E34234); margin-right:18px; transform:translateY(-2px); }
    .km-sk__accentbar { position:absolute; left:10%; width:34%; height:6px; z-index:2;
      background:var(--km-sk-accent,#E34234); transform-origin:left; }
    /* 照片相框：CSS 色块兜底 + <img> 素材层 */
    .km-sk__photo { position:absolute; left:57%; top:47%; width:33%; height:24%; z-index:1;
      background:var(--km-sk-tone,#26241F); border:3px solid #11110F;
      display:flex; align-items:center; justify-content:center;
      color:#8C887F; font:600 24px "Noto Sans SC","PingFang SC",sans-serif;
      box-shadow:10px 12px 0 rgba(17,17,15,.18); overflow:hidden; }
    .km-sk__photo img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
    .km-sk__photocap { position:absolute; left:57%; top:72%; z-index:2;
      font:700 26px ui-monospace,SFMono-Regular,monospace; color:#11110F; letter-spacing:.06em; }
    /* 手绘层：feTurbulence 轻微置换（scale 3，固定 seed 17 → 确定性） */
    .km-sk__drawing { position:absolute; inset:0; width:100%; height:100%; z-index:3; pointer-events:none; }
  </style>

  <div class="km-sk__grid" data-layout-ignore></div>
  <svg class="km-sk__mark" width="44" height="44" viewBox="0 0 44 44" stroke="#E34234" fill="none" stroke-width="3">
    <circle class="km-sk__markring" cx="22" cy="22" r="14"/>
    <line class="km-sk__markline" x1="22" y1="0" x2="22" y2="44"/>
    <line class="km-sk__markline" x1="0" y1="22" x2="44" y2="22"/>
  </svg>
  <div class="km-sk__headline">{{HEADLINE}}</div>

  <div class="km-sk__point km-sk__point--1" style="top:40%;">{{POINT_1}}</div>
  <div class="km-sk__accentbar" style="top:38.4%;"></div>
  <div class="km-sk__point km-sk__point--2" style="top:44.6%;">{{POINT_2}}</div>

  <!-- 照片相框（素材层）+ 图注 + 手绘箭头指向照片 -->
  <div class="km-sk__photo" id="km-sk-photo">
    <div>photo-1 占位</div>
    <img src="assets/media/photo-1.jpg" alt="" onerror="this.remove()">
  </div>
  <div class="km-sk__photocap">{{PHOTO_CAP}}</div>

  <!-- 手绘 SVG：全部线条走 dashoffset 描边动画；feTurbulence 置换加手感 -->
  <svg class="km-sk__drawing" viewBox="0 0 1080 1920" fill="none" preserveAspectRatio="xMidYMid slice">
    <defs>
      <filter id="km-sk-rough" x="-5%" y="-5%" width="110%" height="110%">
        <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="17" result="n"/>
        <feDisplacementMap in="SourceGraphic" in2="n" scale="3"/>
      </filter>
    </defs>
    <g filter="url(#km-sk-rough)" stroke="#11110F" stroke-width="6" stroke-linecap="round">
      <!-- 论点下划线（两段） -->
      <path class="km-sk__stroke" d="M108 790 C 240 782, 420 796, 560 786"/>
      <path class="km-sk__stroke" d="M108 872 C 250 864, 400 878, 520 870"/>
      <!-- 手绘箭头：从论点区指向照片相框 -->
      <path class="km-sk__stroke" id="km-sk-arrow" d="M600 830 C 660 900, 640 1010, 700 1090"/>
      <path class="km-sk__stroke" d="M664 1062 L704 1096 L742 1058"/>
      <!-- 照片相框手绘描边（在相框外圈再"画"一遍，媒介混入） -->
      <rect class="km-sk__stroke" x="572" y="892" width="360" height="470" stroke-width="5"/>
      <!-- 强调圈：圈住图注 -->
      <path class="km-sk__stroke" d="M600 1400 C 640 1372, 760 1370, 810 1396 C 850 1420, 780 1448, 690 1444 C 620 1440, 590 1424, 612 1404" stroke="#E34234" stroke-width="5"/>
    </g>
    <!-- 笔尖圆点（描边时沿当前 path 移动） -->
    <circle id="km-sk-pen" r="9" fill="#11110F" opacity="0"/>
  </svg>
</div>
<!--
  GSAP timeline fragment (deterministic; times scene-relative; first element in by 0.2s;
  second fromTo on the same element carries immediateRender:false).

  笔尖助手（vendor 无 MotionPathPlugin，手动 along-path；纯时间函数，确定性）:
  function kmSketchPen(tl, path, pen, at, dur, ease) {
    const len = path.getTotalLength();
    path.style.strokeDasharray = len;
    path.style.strokeDashoffset = len;
    const p = { t: 0 };
    tl.fromTo(p, { t: 0 }, { t: 1, duration: dur, ease: ease || "power1.inOut",
      onStart: () => { gsap.set(pen, { opacity: 1 }); },
      onComplete: () => { gsap.set(pen, { opacity: 0 }); },
      onUpdate: () => {
        path.style.strokeDashoffset = String(len * (1 - p.t));
        const pt = path.getPointAtLength(Math.max(0.001, len * p.t));
        pen.setAttribute("cx", pt.x); pen.setAttribute("cy", pt.y);
      } }, at);
  }
  注意: helper 内 fromTo 的目标是普通对象 p（不是同一元素二次 fromTo），确定性 seek 安全。
  渲染器要求: 状态写入发生在 onUpdate 回调内，渲染器跳转时必须 seek(t, false)（不抑制回调）——
  本 skill 的 scripts/render-browser.mjs seekRuntime 已如此实现；HyperFrames 同理。

  SFX 挂点: 笔尖沙沙声 → 每段 kmSketchPen 起点（0.9 / 1.5 / 2.6 / 3.4 / 4.3s）。

  const pen = document.querySelector("#km-sk-pen");
  tl.fromTo(".km-sk__markring", { scale: 0, autoAlpha: 0, svgOrigin: "22 22" },
      { scale: 1, autoAlpha: 1, duration: 0.3, ease: "power3.out" }, 0.15)
    .fromTo(".km-sk__markline", { autoAlpha: 0, scale: 0.4, svgOrigin: "22 22" },
      { autoAlpha: 1, scale: 1, duration: 0.3, ease: "power2.inOut", stagger: 0.08 }, 0.25)
    .fromTo(".km-sk__headline", { autoAlpha: 0, y: 30 },
      { autoAlpha: 1, y: 0, duration: 0.45, ease: "power3.out" }, 0.35)
    .fromTo(".km-sk__point--1", { autoAlpha: 0, x: -24 },
      { autoAlpha: 1, x: 0, duration: 0.35, ease: "power2.inOut" }, 0.8)
    .fromTo(".km-sk__accentbar", { scaleX: 0 }, { scaleX: 1, duration: 0.35,
      ease: "power2.inOut" }, 0.9)                                                           // SFX pen-scratch
    .fromTo(".km-sk__point--2", { autoAlpha: 0, x: -24 },
      { autoAlpha: 1, x: 0, duration: 0.35, ease: "power2.inOut" }, 1.2)
    // 描边 + 笔尖（每段一次思维单元，2–3s 一个）
    // kmSketchPen(tl, ".km-sk__stroke:nth-of-type(1)", pen, 1.5, 0.7);                       // SFX pen-scratch
    // kmSketchPen(tl, ".km-sk__stroke:nth-of-type(2)", pen, 2.2, 0.6);
    // kmSketchPen(tl, "#km-sk-arrow", pen, 2.6, 0.8);                                        // SFX pen-scratch
    // kmSketchPen(tl, ".km-sk__stroke:nth-of-type(4)", pen, 3.4, 0.6);
    .fromTo("#km-sk-photo", { autoAlpha: 0, scale: 1.06 },
      { autoAlpha: 1, scale: 1, duration: 0.3, ease: "power3.out",
        immediateRender: false, transformOrigin: "50% 50%" }, 3.2)
    .fromTo(".km-sk__photocap", { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.3 }, 3.5)
    // kmSketchPen(tl, ".km-sk__stroke:nth-of-type(5)", pen, 4.3, 0.9);                       // SFX pen-scratch（强调圈）
-->
