<script>
  window.__timelines = window.__timelines || {};
  const tl = gsap.timeline({ paused:true });

  /* 笔尖助手：vendor 仅 gsap 核心（无 MotionPathPlugin）。
     getTotalLength 在构建期（时间线注册前）测量一次，onUpdate 只写 dashoffset 与笔尖坐标——
     HyperFrames 渲染 seek 需 suppressEvents=false 才会重放 onUpdate（见 hand-sketch 模板注释）。 */
  function kmSketchPen(tl, target, pen, at, dur, ease) {
    const path = document.querySelector(target);
    const penEl = typeof pen === 'string' ? document.querySelector(pen) : pen;
    if (!path || !penEl) return;
    const len = path.getTotalLength();
    path.style.strokeDasharray = String(len);
    path.style.strokeDashoffset = String(len);
    const p = { t: 0 };
    tl.fromTo(p, { t: 0 }, { t: 1, duration: dur, ease: ease || "power1.inOut",
      onStart: () => { gsap.set(penEl, { opacity: 1 }); },
      onComplete: () => { gsap.set(penEl, { opacity: 0 }); },
      onUpdate: () => {
        path.style.strokeDashoffset = String(len * (1 - p.t));
        const pt = path.getPointAtLength(Math.max(0.001, len * p.t));
        penEl.setAttribute("cx", pt.x); penEl.setAttribute("cy", pt.y);
      } }, at);
  }
  function markIn(id, at) {
    tl.fromTo('#' + id + ' circle', { scale:0, autoAlpha:0, svgOrigin:'22 22' },
      { scale:1, autoAlpha:1, duration:.3, ease:'power3.out' }, at)
     .fromTo('#' + id + ' line', { autoAlpha:0, scale:.4, svgOrigin:'22 22' },
      { autoAlpha:1, scale:1, duration:.25, ease:'power2.inOut', stagger:.06 }, at + .06);
  }

  /* ============ furniture ============ */
  tl.fromTo('#fu-rule', {scaleX:0}, {scaleX:1, duration:.5, ease:'power3.out'}, .15);

  /* ============ s01 · 0–3.42s · beats: 0.1 下划线 / 0.48 文案→文档卡 / 2.64 知识视频→胶片框 ============ */
  markIn('s1-mark', .1);
  tl.fromTo('#s1-headline', {autoAlpha:0, y:28}, {autoAlpha:1, y:0, duration:.45, ease:'power3.out'}, .1)
    .fromTo('#s1-doc-label', {autoAlpha:0}, {autoAlpha:1, duration:.3}, .48)
    .fromTo('#s1-film-label', {autoAlpha:0}, {autoAlpha:1, duration:.3}, 2.7);
  kmSketchPen(tl, '#s1-underline', '#s1-pen', .1, .45);           /* beat 0.1 */
  kmSketchPen(tl, '#s1-doc', '#s1-pen', .48, .5);                 /* beat 0.48 文案 */
  kmSketchPen(tl, '#s1-doc-fold', '#s1-pen', 1.0, .14);
  kmSketchPen(tl, '#s1-l1', '#s1-pen', 1.18, .18);
  kmSketchPen(tl, '#s1-l2', '#s1-pen', 1.38, .18);
