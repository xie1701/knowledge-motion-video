<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1080, height=1920" />
  <title>文案不是成片 — bold-social / kinetic-typography 样片</title>
  <script src="vendor/gsap.min.js"></script>
  <style>
    @font-face { font-family: 'PingFang SC'; src: local('PingFang SC'); }
    @font-face { font-family: 'Noto Sans SC'; src: local('Noto Sans SC'); }
    /* bold-social design tokens (assets/styles/bold-social.json) */
    :root { --bg:#11110F; --fg:#FFFFFF; --accent:#F36B3D; --muted:#8C887F; }
    * { box-sizing:border-box; }
    html, body { margin:0; width:1080px; height:1920px; overflow:hidden; background:var(--bg); color:var(--fg); font-family:"PingFang SC","Noto Sans SC",sans-serif; }
    #root { position:relative; width:1080px; height:1920px; overflow:hidden; }
    .clip { position:absolute; inset:0; overflow:hidden; background:var(--bg); }
    .grid { position:absolute; inset:0; opacity:.12; background-image:linear-gradient(rgba(255,255,255,.14) 2px,transparent 2px),linear-gradient(90deg,rgba(255,255,255,.14) 2px,transparent 2px); background-size:108px 108px; }
    .meta { position:absolute; top:86px; left:72px; right:72px; display:flex; justify-content:space-between; font:700 24px ui-monospace,monospace; color:var(--muted); letter-spacing:.1em; }
    .rule { position:absolute; left:72px; right:72px; top:145px; height:4px; background:var(--accent); transform-origin:left center; }

    /* ---- s01 · build: oversized headline slam + accent slab ---- */
    .s01-slab { position:absolute; right:-110px; top:400px; width:360px; height:230px; background:var(--accent); transform:rotate(6deg); }
    .s01-headline { position:absolute; left:86px; top:540px; width:908px; margin:0; font-size:168px; line-height:1.08; font-weight:900; letter-spacing:-.03em; }
    .s01-key { color:var(--accent); }
    .s01-underline { position:absolute; left:86px; top:1000px; width:460px; height:14px; background:var(--accent); transform-origin:left center; }
    .s01-sub { position:absolute; left:86px; top:1080px; margin:0; font-size:48px; font-weight:800; letter-spacing:.14em; color:var(--fg); }
    .s01-sub em { color:var(--muted); font-style:normal; }

    /* ---- s02 · breathe: four beat words in a 2x2 kinetic grid ---- */
    .s02-grid { position:absolute; left:86px; top:520px; width:908px; display:grid; grid-template-columns:1fr 1fr; row-gap:150px; }
    .s02-cell { position:relative; }
    .s02-index { display:block; font:700 26px ui-monospace,monospace; color:var(--muted); letter-spacing:.2em; margin-bottom:18px; }
    .s02-word { display:block; font-size:170px; font-weight:900; letter-spacing:-.02em; line-height:1; }
    .s02-word.is-accent { color:var(--accent); }
    .s02-bar { position:absolute; left:4px; bottom:-34px; width:220px; height:10px; background:var(--accent); transform-origin:left center; }

    /* ---- s03 · resolve: responsibility labels + 观点→画面 payoff ---- */
    .s03-labels { position:absolute; left:86px; right:86px; top:440px; display:grid; grid-template-columns:1fr 1fr; gap:28px; }
    .s03-label { border-top:5px solid var(--fg); padding-top:24px; font-size:36px; color:var(--muted); font-weight:700; }
    .s03-label strong { display:block; color:var(--fg); font-size:52px; font-weight:900; margin-bottom:8px; }
    .s03-transform { position:absolute; left:86px; right:86px; top:1060px; display:flex; align-items:center; justify-content:center; gap:40px; font-size:132px; font-weight:900; letter-spacing:-.02em; }
    .s03-arrow { color:var(--accent); font-size:104px; transform-origin:left center; }
    .s03-word-b { color:var(--accent); }
  </style>
</head>
<body>
<div id="root" data-composition-id="bold-social-style-sample" data-start="0" data-width="1080" data-height="1920" data-duration="10.4">
  <!-- furniture layer: full duration, track 0 -->
  <section class="clip" id="furniture-base" data-start="0" data-duration="10.4" data-track-index="0">
    <div class="grid" data-layout-ignore></div>
    <div class="meta"><span>KNOWLEDGE / MOTION</span><span>BOLD-SOCIAL SAMPLE</span></div>
    <div class="rule"></div>
  </section>

  <!-- s01 · build (0–2.8s): 大字冲击开版 -->
  <section class="clip" id="clip-s01" data-start="0" data-duration="2.8" data-track-index="1">
    <div class="s01-slab" id="s01-slab" data-layout-ignore></div>
    <h1 class="s01-headline" id="s01-headline">文案不是<br/><span class="s01-key" id="s01-key">成片</span></h1>
    <div class="s01-underline" id="s01-underline" data-layout-ignore></div>
    <p class="s01-sub" id="s01-sub">从观点到知识动画</p>
  </section>

  <!-- s02 · breathe (2.8–7.6s): 四词节拍卡点 -->
  <section class="clip" id="clip-s02" data-start="2.8" data-duration="4.8" data-track-index="1">
    <div class="s02-grid" id="s02-grid">
      <div class="s02-cell" id="s02-cell-1"><span class="s02-index">01</span><span class="s02-word" id="s02-word-1">观点</span><span class="s02-bar" id="s02-bar-1" data-layout-ignore></span></div>
      <div class="s02-cell" id="s02-cell-2"><span class="s02-index">02</span><span class="s02-word" id="s02-word-2">结构</span><span class="s02-bar" id="s02-bar-2" data-layout-ignore></span></div>
      <div class="s02-cell" id="s02-cell-3"><span class="s02-index">03</span><span class="s02-word" id="s02-word-3">分镜</span><span class="s02-bar" id="s02-bar-3" data-layout-ignore></span></div>
      <div class="s02-cell" id="s02-cell-4"><span class="s02-index">04</span><span class="s02-word is-accent" id="s02-word-4">动画</span><span class="s02-bar" id="s02-bar-4" data-layout-ignore></span></div>
    </div>
  </section>

  <!-- s03 · resolve (7.6–10.4s): 责任标签 + 收束图形 -->
  <section class="clip" id="clip-s03" data-start="7.6" data-duration="2.8" data-track-index="1">
    <div class="s03-labels" id="s03-labels">
      <div class="s03-label" id="s03-label-you"><strong>你</strong>观点与故事</div>
      <div class="s03-label" id="s03-label-skill"><strong>Skill</strong>逻辑变画面</div>
    </div>
    <div class="s03-transform" id="s03-transform">
      <span class="s03-word" id="s03-word-a">观点</span><span class="s03-arrow" id="s03-arrow">→</span><span class="s03-word s03-word-b" id="s03-word-b">画面</span>
    </div>
  </section>
</div>
<script>
  window.__timelines = window.__timelines || {};
  const tl = gsap.timeline({ paused:true });
  /* bold-social motion: defaultEase power3.out · staggerSec 0.1 · hard cuts · hold final >= 0.9s */

  /* furniture — animates once for the whole film */
  tl.fromTo('.rule',{scaleX:0},{scaleX:1,duration:.5,ease:'power3.out'},.15);

  /* s01 — build: slab sweep, headline slam, key-word 成片 accent + single pulse */
  tl.fromTo('#s01-slab',{x:300,autoAlpha:0},{x:0,autoAlpha:.9,duration:.4,ease:'power3.out'},.05);
  tl.fromTo('#s01-headline',{autoAlpha:0,scale:1.35},{autoAlpha:1,scale:1,duration:.35,ease:'power3.out',transformOrigin:'50% 50%'},.2);
  tl.fromTo('#s01-key',{autoAlpha:0,scale:1.5},{autoAlpha:1,scale:1,duration:.3,ease:'power4.in',transformOrigin:'50% 50%'},.9);
  tl.fromTo('#s01-underline',{scaleX:0},{scaleX:1,duration:.35,ease:'power2.out'},1.2);
  tl.fromTo('#s01-sub',{y:40,autoAlpha:0},{y:0,autoAlpha:1,duration:.35,ease:'power3.out'},1.5);
  tl.fromTo('#s01-key',{scale:1},{scale:1.12,duration:.18,yoyo:true,repeat:1,ease:'power2.inOut',immediateRender:false},1.7);

  /* s02 — breathe: four beat words slam in on rhythm (scene-relative .2/1.1/2.0/2.9 → abs 3.0/3.9/4.8/5.7) */
  tl.fromTo('#s02-word-1',{autoAlpha:0,scale:1.45},{autoAlpha:1,scale:1,duration:.32,ease:'power3.out',transformOrigin:'50% 50%'},2.85);
  tl.fromTo('#s02-bar-1',{scaleX:0},{scaleX:1,duration:.3,ease:'power2.out'},3.05);
  tl.fromTo('#s02-word-2',{autoAlpha:0,scale:1.45},{autoAlpha:1,scale:1,duration:.32,ease:'power3.out',transformOrigin:'50% 50%'},3.9);
  tl.fromTo('#s02-bar-2',{scaleX:0},{scaleX:1,duration:.3,ease:'power2.out'},4.1);
  tl.fromTo('#s02-word-3',{autoAlpha:0,scale:1.45},{autoAlpha:1,scale:1,duration:.32,ease:'power3.out',transformOrigin:'50% 50%'},4.8);
  tl.fromTo('#s02-bar-3',{scaleX:0},{scaleX:1,duration:.3,ease:'power2.out'},5.0);
  tl.fromTo('#s02-word-4',{autoAlpha:0,scale:1.45},{autoAlpha:1,scale:1,duration:.32,ease:'power3.out',transformOrigin:'50% 50%'},5.7);
  tl.fromTo('#s02-bar-4',{scaleX:0},{scaleX:1,duration:.3,ease:'power2.out'},5.9);
  /* one finite pulse on the single emphasized word */
  tl.fromTo('#s02-word-4',{scale:1},{scale:1.12,duration:.18,yoyo:true,repeat:1,ease:'power2.inOut',immediateRender:false},6.3);

  /* s03 — resolve: labels rise, 观点→画面 payoff, hold 0.9s to end */
  tl.fromTo('.s03-label',{y:45,autoAlpha:0},{y:0,autoAlpha:1,duration:.5,ease:'power3.out',stagger:.18},7.68);
  tl.fromTo('#s03-word-a',{autoAlpha:0,scale:1.35},{autoAlpha:1,scale:1,duration:.35,ease:'power3.out',transformOrigin:'50% 50%'},8.15);
  tl.fromTo('#s03-arrow',{scaleX:0,autoAlpha:0},{scaleX:1,autoAlpha:1,duration:.36,ease:'power3.inOut'},8.45);
  tl.fromTo('#s03-word-b',{autoAlpha:0,scale:1.35},{autoAlpha:1,scale:1,duration:.35,ease:'power3.out',transformOrigin:'50% 50%'},8.6);
  tl.fromTo('#s03-word-b',{scale:1},{scale:1.12,duration:.18,yoyo:true,repeat:1,ease:'power2.inOut',immediateRender:false},9.1);
  /* final state holds untouched from ~9.5s to 10.4s */

  window.__timelines['bold-social-style-sample'] = tl;
</script>
</body>
</html>
