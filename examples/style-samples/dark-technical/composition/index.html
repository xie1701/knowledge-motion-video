<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1080, height=1920" />
  <title>文案不是成片 — dark-technical / data-viz</title>
  <script src="vendor/gsap.min.js"></script>
  <style>
    /* dark-technical design tokens (assets/styles/dark-technical.json) */
    @font-face { font-family: 'PingFang SC'; src: local('PingFang SC'); }
    @font-face { font-family: 'Noto Sans SC'; src: local('Noto Sans SC'); }
    :root { --bg:#0F1114; --paper:#F5F1E8; --accent:#4FD1C5; --muted:#5F6368; }
    * { box-sizing:border-box; }
    html, body { margin:0; width:1080px; height:1920px; overflow:hidden; background:var(--bg); color:var(--paper); font-family:"Noto Sans SC","PingFang SC",sans-serif; }
    #root { position:relative; width:1080px; height:1920px; overflow:hidden; }
    .scene-fill { position:absolute; inset:0; background:var(--bg); }
    .clip { position:absolute; inset:0; overflow:hidden; }
    /* tech grid: muted low-opacity lines (per style notes) */
    .grid { position:absolute; inset:0; opacity:.18; background-image:linear-gradient(rgba(95,99,104,.35) 1px,transparent 1px),linear-gradient(90deg,rgba(95,99,104,.35) 1px,transparent 1px); background-size:90px 90px; }
    .meta { position:absolute; top:86px; left:72px; right:72px; display:flex; justify-content:space-between; font:700 24px ui-monospace,monospace; color:var(--muted); letter-spacing:.1em; }
    .rule { position:absolute; left:72px; right:72px; top:145px; height:3px; background:var(--accent); transform-origin:left center; }
    /* footer text sits fully above the bottom 230px caption safe zone (y > 1690) */
    .footer { position:absolute; left:72px; right:72px; bottom:280px; display:flex; justify-content:space-between; font:700 22px ui-monospace,monospace; color:var(--muted); letter-spacing:.08em; }
    .footer .stamp { color:var(--accent); }

    /* s01 — build: headline lockup on dark tech grid */
    .kicker { position:absolute; left:72px; top:250px; font:700 28px ui-monospace,monospace; color:var(--accent); letter-spacing:.18em; }
    .headline { position:absolute; left:72px; top:330px; width:920px; font-size:118px; line-height:1.06; font-weight:900; letter-spacing:-.04em; }
    .headline em { color:var(--accent); font-style:normal; }
    .subtitle { position:absolute; left:72px; top:700px; font-size:46px; font-weight:700; color:var(--muted); }
    .subtitle strong { color:var(--paper); }
    .h-baseline { position:absolute; left:72px; width:220px; top:660px; height:4px; background:var(--accent); transform-origin:left center; }

    /* s02 — breathe: data-viz route (bars, axis first, direct value labels) */
    .viz-title { position:absolute; left:72px; top:270px; font-size:56px; font-weight:900; letter-spacing:-.02em; }
    .viz-unit { position:absolute; right:72px; top:290px; font:600 26px ui-monospace,monospace; color:var(--muted); }
    .viz-plot { position:absolute; left:72px; top:480px; width:936px; height:860px; }
    .viz-gridlines { position:absolute; inset:0; opacity:.5; }
    .viz-axis { position:absolute; left:0; bottom:0; width:100%; height:4px; background:var(--paper); transform-origin:left center; }
    .viz-group { position:absolute; bottom:4px; width:26%; height:100%; display:flex; align-items:flex-end; justify-content:center; }
    #viz-group-1 { left:2%; } #viz-group-2 { left:37%; } #viz-group-3 { left:72%; }
    .viz-bar { width:72%; background:var(--paper); transform-origin:bottom; }
    #viz-bar-1 { height:100%; } /* 文字量 100 */
    #viz-bar-2 { height:38%; } /* 逻辑骨架 38 */
    #viz-bar-3 { height:86%; background:var(--accent); } /* 观众理解 86 — key */
    .viz-value { position:absolute; transform:translateX(-50%); font:800 40px ui-monospace,monospace; color:var(--paper); }
    #viz-value-1 { left:15%; bottom:100%; }
    #viz-value-2 { left:50%; bottom:41%; }
    #viz-value-3 { left:85%; bottom:89%; color:var(--accent); }
    .viz-label { position:absolute; top:calc(100% + 28px); width:26%; text-align:center; font-size:32px; font-weight:700; color:var(--muted); }
    #viz-label-1 { left:2%; } #viz-label-2 { left:37%; } #viz-label-3 { left:72%; color:var(--paper); }
    .viz-note { position:absolute; left:72px; top:1500px; font:700 26px ui-monospace,monospace; color:var(--muted); letter-spacing:.08em; }
    .viz-note em { color:var(--accent); font-style:normal; }

    /* s03 — resolve: responsibility labels + transformation payoff (all text above y 1690) */
    .resp { position:absolute; left:72px; right:72px; top:560px; display:grid; grid-template-columns:1fr 1fr; gap:28px; }
    .resp-card { border:2px solid rgba(95,99,104,.6); border-top:6px solid var(--accent); padding:36px 32px; background:rgba(245,241,232,.04); }
    .resp-card .who { font:700 26px ui-monospace,monospace; color:var(--accent); letter-spacing:.14em; display:block; margin-bottom:18px; }
    .resp-card .what { font-size:52px; font-weight:900; line-height:1.2; }
    .transform { position:absolute; left:72px; right:72px; top:1060px; display:flex; align-items:center; justify-content:center; gap:40px; font-size:104px; font-weight:900; }
    .t-arrow { color:var(--accent); font-size:84px; transform-origin:left center; }
    .t-accent { color:var(--accent); }
    .t-track { position:absolute; left:172px; right:172px; top:1240px; height:3px; background:rgba(95,99,104,.6); transform-origin:left center; }
  </style>
</head>
<body>
<div id="root" data-composition-id="dark-technical-data-viz-sample" data-start="0" data-width="1080" data-height="1920" data-duration="10.4">
  <!-- furniture layer: full duration, track 0 -->
  <section class="clip" id="furniture-base" data-start="0" data-duration="10.4" data-track-index="0">
    <div class="scene-fill"></div><div class="grid" id="fx-grid" data-layout-ignore></div>
    <div class="meta" id="fx-meta"><span>KNOWLEDGE / MOTION</span><span>DARK-TECHNICAL</span></div>
    <div class="rule" id="fx-rule"></div>
    <div class="footer" id="fx-footer"><span>DATA-VIZ ROUTE</span><span class="stamp">BUILD → BREATHE → RESOLVE</span></div>
  </section>
  <!-- s01 — build -->
  <section class="clip" id="clip-s01" data-start="0" data-duration="2.8" data-track-index="1">
    <p class="kicker" id="s01-kicker">// BUILD 01</p>
    <h1 class="headline" id="s01-headline">文案不是<br/><em>成片</em></h1>
    <div class="h-baseline" id="s01-baseline"></div>
    <p class="subtitle" id="s01-subtitle">从<strong>观点</strong>到<strong>知识动画</strong></p>
  </section>
  <!-- s02 — breathe: data-viz -->
  <section class="clip" id="clip-s02" data-start="2.8" data-duration="4.8" data-track-index="1">
    <h2 class="viz-title" id="viz-title">从文字量到观众理解</h2>
    <p class="viz-unit" id="viz-unit">UNIT / %</p>
    <div class="viz-plot" id="viz-plot">
      <svg class="viz-gridlines" id="viz-gridlines" width="100%" height="100%" preserveAspectRatio="none" stroke="#5F6368" stroke-width="1">
        <line x1="0" y1="25%" x2="100%" y2="25%"/><line x1="0" y1="50%" x2="100%" y2="50%"/><line x1="0" y1="75%" x2="100%" y2="75%"/>
      </svg>
      <div class="viz-axis" id="viz-axis"></div>
      <div class="viz-group" id="viz-group-1"><div class="viz-bar" id="viz-bar-1" data-value="100"></div></div>
      <div class="viz-group" id="viz-group-2"><div class="viz-bar" id="viz-bar-2" data-value="38"></div></div>
      <div class="viz-group" id="viz-group-3"><div class="viz-bar viz-bar--key" id="viz-bar-3" data-value="86"></div></div>
      <div class="viz-value" id="viz-value-1">100</div>
      <div class="viz-value" id="viz-value-2">38</div>
      <div class="viz-value" id="viz-value-3">86</div>
      <p class="viz-label" id="viz-label-1">原始文字量</p>
      <p class="viz-label" id="viz-label-2">逻辑骨架</p>
      <p class="viz-label" id="viz-label-3">观众理解</p>
    </div>
    <p class="viz-note" id="viz-note">文字 -62% · 理解 <em>保持 86%</em></p>
  </section>
  <!-- s03 — resolve -->
  <section class="clip" id="clip-s03" data-start="7.6" data-duration="2.8" data-track-index="1">
    <div class="resp" id="s03-resp">
      <div class="resp-card" id="s03-label-you"><span class="who">YOU / 你</span><span class="what">观点与故事</span></div>
      <div class="resp-card" id="s03-label-skill"><span class="who">SKILL</span><span class="what">逻辑变画面</span></div>
    </div>
    <div class="transform" id="s03-transform">
      <span class="t-word" id="s03-word-src">观点</span><span class="t-arrow" id="s03-arrow">→</span><span class="t-word t-accent" id="s03-word-dst">画面</span>
    </div>
    <div class="t-track" id="s03-track"></div>
  </section>
</div>
<script>
  window.__timelines = window.__timelines || {};
  const tl = gsap.timeline({ paused:true });
  /* dark-technical motion: defaultEase power3.out, stagger 0.12, holdFinalState 1.0 */
  /* furniture — animates once for the whole chapter */
  tl.fromTo('#fx-meta',{autoAlpha:0},{autoAlpha:1,duration:.4,ease:'power3.out'},.1);
  tl.fromTo('#fx-rule',{scaleX:0},{scaleX:1,duration:.55,ease:'expo.out'},.15);
  tl.fromTo('#fx-footer',{autoAlpha:0},{autoAlpha:1,duration:.4,ease:'power3.out'},.55);
  /* s01 — build: headline lockup (0 – 2.8) */
  tl.fromTo('#s01-kicker',{x:-40,autoAlpha:0},{x:0,autoAlpha:1,duration:.4,ease:'power3.out'},.05);
  tl.fromTo('#s01-headline',{y:60,autoAlpha:0},{y:0,autoAlpha:1,duration:.72,ease:'power4.out'},.15);
  tl.fromTo('#s01-baseline',{scaleX:0},{scaleX:1,duration:.45,ease:'power3.inOut'},.75);
  tl.fromTo('#s01-subtitle',{y:36,autoAlpha:0},{y:0,autoAlpha:1,duration:.5,ease:'power3.out'},.9);
  tl.to('#s01-headline',{y:-8,duration:1.2,ease:'sine.inOut'},1.5); /* settle drift before hard-cut out */
  /* s02 — breathe: data-viz bars grow from axis (2.8 – 7.6); axis first, then data */
  tl.fromTo('#viz-title',{y:24,autoAlpha:0},{y:0,autoAlpha:1,duration:.4,ease:'power3.out'},2.88);
  tl.fromTo('#viz-unit',{autoAlpha:0},{autoAlpha:1,duration:.3,ease:'power3.out'},2.95);
  tl.fromTo('#viz-gridlines',{autoAlpha:0},{autoAlpha:1,duration:.35,ease:'power3.out'},2.95);
  tl.fromTo('#viz-axis',{scaleX:0},{scaleX:1,duration:.5,ease:'power3.inOut'},3.05);
  tl.fromTo('.viz-bar',{scaleY:0},{scaleY:1,duration:.6,stagger:.12,ease:'power3.out'},3.45);
  tl.fromTo('.viz-value',{autoAlpha:0,y:12},{autoAlpha:1,y:0,duration:.3,stagger:.12,ease:'power3.out'},4.05);
  tl.fromTo('.viz-label',{autoAlpha:0},{autoAlpha:1,duration:.3,stagger:.12,ease:'power3.out'},4.4);
  tl.fromTo('#viz-note',{autoAlpha:0,y:16},{autoAlpha:1,y:0,duration:.4,ease:'power3.out'},4.8);
  /* key-bar emphasis: dim the rest, pulse the accent bar once */
  tl.fromTo('#viz-bar-1,#viz-bar-2',{opacity:1},{opacity:.35,duration:.45,ease:'power3.out'},5.7);
  tl.fromTo('#viz-value-1,#viz-value-2',{opacity:1},{opacity:.4,duration:.45,ease:'power3.out'},5.7);
  tl.fromTo('#viz-bar-3',{scale:1},{scale:1.04,duration:.3,yoyo:true,repeat:1,transformOrigin:'bottom',ease:'power2.inOut',immediateRender:false},5.85);
  tl.to('#viz-plot',{x:-12,y:8,duration:1.2,ease:'sine.inOut'},6.2); /* breathe drift */
  /* s03 — resolve: responsibility cards, then transformation payoff (7.6 – 10.4) */
  tl.fromTo('.resp-card',{y:45,autoAlpha:0},{y:0,autoAlpha:1,duration:.5,stagger:.12,ease:'power3.out'},7.75);
  tl.fromTo('#s03-word-src',{y:36,autoAlpha:0},{y:0,autoAlpha:1,duration:.42,ease:'power3.out'},8.35);
  tl.fromTo('#s03-arrow',{scaleX:0,autoAlpha:0},{scaleX:1,autoAlpha:1,duration:.36,ease:'power3.inOut'},8.7);
  tl.fromTo('#s03-word-dst',{y:36,autoAlpha:0},{y:0,autoAlpha:1,duration:.42,ease:'power3.out'},8.85);
  tl.fromTo('#s03-track',{scaleX:0},{scaleX:1,duration:.5,ease:'power3.inOut'},9.05);
  tl.to('#fx-grid',{opacity:.26,duration:1.0,ease:'sine.inOut'},9.1); /* fade-style settle before end */
  /* hold final state for the last ~1.0s (dark-technical holdFinalStateSec) */
  window.__timelines['dark-technical-data-viz-sample'] = tl;
</script>
</body>
</html>
