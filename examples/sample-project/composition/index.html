<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1080, height=1920" />
  <title>文案不是成片</title>
  <script src="vendor/gsap.min.js"></script>
  <style>
    @font-face { font-family: 'PingFang SC'; src: local('PingFang SC'); }
    @font-face { font-family: 'Noto Sans SC'; src: local('Noto Sans SC'); }
    :root { --bg:#11110f; --paper:#f5f1e8; --accent:#f36b3d; --muted:#8c887f; }
    * { box-sizing:border-box; }
    html, body { margin:0; width:1080px; height:1920px; overflow:hidden; background:var(--bg); color:var(--paper); font-family:"PingFang SC","Noto Sans SC",sans-serif; }
    #root { position:relative; width:1080px; height:1920px; overflow:hidden; }
    .scene-fill { position:absolute; inset:0; background:var(--bg); }
    .clip { position:absolute; inset:0; overflow:hidden; }
    .grid { position:absolute; inset:0; opacity:.16; background-image:linear-gradient(rgba(245,241,232,.12) 2px,transparent 2px),linear-gradient(90deg,rgba(245,241,232,.12) 2px,transparent 2px); background-size:90px 90px; }
    .meta { position:absolute; top:86px; left:72px; right:72px; display:flex; justify-content:space-between; font:700 24px ui-monospace,monospace; color:var(--muted); letter-spacing:.08em; }
    .rule { position:absolute; left:72px; right:72px; top:145px; height:3px; background:var(--accent); transform-origin:left center; }
    .headline { position:absolute; left:72px; top:220px; width:850px; font-size:104px; line-height:1.04; font-weight:900; letter-spacing:-.055em; }
    .headline em { color:var(--accent); font-style:normal; }
    .doc { position:absolute; left:110px; top:610px; width:360px; height:480px; background:var(--paper); color:var(--bg); padding:46px 38px; box-shadow:20px 24px 0 var(--accent); }
    .doc h2 { margin:0 0 30px; font-size:52px; }
    .doc p { margin:16px 0; font:700 29px ui-monospace,monospace; }
    .pipe { position:absolute; left:540px; top:665px; width:450px; height:450px; }
    .node { position:absolute; width:190px; height:96px; border:4px solid var(--paper); display:grid; place-items:center; font-size:30px; font-weight:800; background:var(--bg); }
    #node-a { left:0; top:0; } #node-b { right:0; top:142px; } #node-c { left:0; bottom:0; }
    .connector { position:absolute; height:4px; width:220px; background:var(--accent); transform-origin:left center; }
    #line-a { left:150px; top:90px; transform:rotate(24deg); } #line-b { left:165px; top:345px; transform:rotate(-28deg); }
    .labels { position:absolute; left:72px; right:72px; top:1200px; display:grid; grid-template-columns:1fr 1fr; gap:24px; }
    .label { border-top:4px solid var(--paper); padding-top:20px; font-size:34px; color:var(--muted); }
    .label strong { display:block; color:var(--paper); font-size:48px; }
    .caption { position:absolute; left:72px; right:72px; bottom:145px; min-height:178px; display:flex; align-items:center; justify-content:center; text-align:center; font-size:50px; line-height:1.35; font-weight:800; padding:18px 36px; background:rgba(17,17,15,.88); border:3px solid rgba(245,241,232,.22); }
    .transform { position:absolute; left:72px; right:72px; top:1400px; display:flex; align-items:center; justify-content:center; gap:36px; font-size:88px; font-weight:900; }
    .t-arrow { color:var(--accent); font-size:72px; }
    .t-accent { color:var(--accent); }
    .footer { position:absolute; left:72px; right:72px; bottom:72px; display:flex; justify-content:space-between; font:700 22px ui-monospace,monospace; color:var(--muted); }
    .stamp { color:var(--accent); }
  </style>
</head>
<body>
<div id="root" data-composition-id="knowledge-motion-demo" data-start="0" data-width="1080" data-height="1920" data-duration="10.4">
  <section class="clip" id="furniture-base" data-start="0" data-duration="10.4" data-track-index="0">
    <div class="scene-fill"></div><div class="grid" data-layout-ignore></div>
    <div class="meta"><span>KNOWLEDGE / MOTION</span><span>DEMO</span></div>
    <div class="rule"></div>
    <div class="footer"><span>SWISS SKETCH ROUTE</span><span class="stamp">BUILD → BREATHE → RESOLVE</span></div>
  </section>
  <section class="clip" id="clip-s01" data-start="0" data-duration="2.8" data-track-index="1">
    <h1 class="headline">文案写完<br/>只是<em>起点</em></h1>
    <article class="doc"><h2>一份文案</h2><p>观点 ✓</p><p>结构 ✓</p><p>画面 ?</p><p>节奏 ?</p></article>
  </section>
  <section class="clip" id="clip-s02" data-start="2.8" data-duration="4.8" data-track-index="1">
    <div class="pipe">
      <div id="node-a" class="node">你讲清楚</div><div id="node-b" class="node">Skill 变画面</div><div id="node-c" class="node">观众看懂</div>
      <div id="line-a" class="connector"></div><div id="line-b" class="connector"></div>
    </div>
  </section>
  <section class="clip" id="clip-s03" data-start="7.6" data-duration="2.8" data-track-index="1">
    <div class="labels"><div class="label"><strong>你</strong>观点与故事</div><div class="label"><strong>Skill</strong>逻辑变画面</div></div>
    <div class="transform" data-layout-allow-caption-zone>
      <span class="t-word">观点</span><span class="t-arrow">→</span><span class="t-word t-accent">画面</span>
    </div>
  </section>
</div>
<script>
  window.__timelines = window.__timelines || {};
  const tl = gsap.timeline({ paused:true });
  /* shared furniture */
  tl.fromTo('.rule',{scaleX:0},{scaleX:1,duration:.55,ease:'expo.out'},.15);
  /* s01 — build: headline + document */
  tl.fromTo('.headline',{x:-70,opacity:0},{x:0,opacity:1,duration:.72,ease:'power4.out'},.25);
  tl.fromTo('.doc',{y:100,rotation:-5,opacity:0},{y:0,rotation:0,opacity:1,duration:.68,ease:'back.out(1.35)'},.95);
  /* s02 — build: pipeline assembles; breathe: gentle drift */
  tl.fromTo('.node',{scale:0,opacity:0},{scale:1,opacity:1,duration:.42,ease:'back.out(1.7)',stagger:.22},2.9);
  tl.fromTo('.connector',{scaleX:0},{scaleX:1,duration:.48,ease:'power3.inOut',stagger:.26},3.5);
  tl.to('.pipe',{x:-16,y:10,duration:1.5,ease:'sine.inOut'},4.6);
  /* s03 — resolve: labels, transformation payoff, hold */
  tl.fromTo('.labels .label',{y:45,opacity:0},{y:0,opacity:1,duration:.5,ease:'power3.out',stagger:.18},7.7);
  tl.fromTo('.transform .t-word',{y:36,opacity:0},{y:0,opacity:1,duration:.42,ease:'power3.out',stagger:.2},8.15);
  tl.fromTo('.transform .t-arrow',{scaleX:0,opacity:0},{scaleX:1,opacity:1,duration:.36,ease:'power3.inOut'},8.55);
  tl.to('.grid',{opacity:.24,duration:1.2,ease:'sine.inOut'},8.9);
  window.__timelines['knowledge-motion-demo'] = tl;
</script>
</body>
</html>
